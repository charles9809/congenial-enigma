name: Windows 2025 - Playit noVNC Remote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-2025-playit-remote
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:

  windows-remote:

    name: Windows Server 2025 Remote

    runs-on: windows-2025

    # GitHub maximum allowed runtime for this job
    timeout-minutes: 360

    env:
      RDP_USER: amiraliali3
      PLAYIT_DIR: C:\playit
      NOVNC_DIR: C:\noVNC

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: "🖥️ System Information"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             WINDOWS SERVER 2025"
          Write-Host "=================================================="

          $os = Get-ComputerInfo

          Write-Host "OS:"
          Write-Host $os.WindowsProductName

          Write-Host "Version:"
          Write-Host $os.WindowsVersion

          Write-Host "Architecture:"
          Write-Host $os.OsArchitecture

          Write-Host ""
          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"

          $ram = Get-CimInstance Win32_ComputerSystem

          Write-Host (
            "{0:N2} GB" -f
            ($ram.TotalPhysicalMemory / 1GB)
          )

      # ============================================================
      # PLAYIT - INSTALL FIRST
      # ============================================================

      - name: "🎮 Install Playit"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "                 PLAYIT SETUP"
          Write-Host "=================================================="

          New-Item `
            -ItemType Directory `
            -Path $env:PLAYIT_DIR `
            -Force |
            Out-Null

          # Official Playit Windows installation method.
          # The official agent repository documents winget as
          # an installation option for Windows.

          $winget =
            Get-Command winget `
              -ErrorAction SilentlyContinue

          if ($null -eq $winget) {

            throw "Windows Package Manager (winget) was not found."
          }

          Write-Host "Installing official Playit agent..."

          winget install `
            --id DevelopedMethods.playit `
            --exact `
            --accept-source-agreements `
            --accept-package-agreements `
            --silent

          if ($LASTEXITCODE -ne 0) {

            Write-Warning (
              "winget returned exit code {0}. " +
              "Trying to locate an existing Playit installation." -f
              $LASTEXITCODE
            )
          }

          $candidates = @(
            "$env:ProgramFiles\playit\playit.exe",
            "$env:ProgramFiles\Playit\playit.exe",
            "${env:ProgramFiles(x86)}\playit\playit.exe",
            "${env:ProgramFiles(x86)}\Playit\playit.exe",
            "$env:LOCALAPPDATA\Programs\playit\playit.exe"
          )

          $playit = $null

          foreach ($candidate in $candidates) {

            if (Test-Path $candidate) {

              $playit = $candidate
              break
            }
          }

          if ($null -eq $playit) {

            $playit =
              Get-ChildItem `
                "$env:ProgramFiles",
                "${env:ProgramFiles(x86)}",
                "$env:LOCALAPPDATA" `
                -Filter "playit.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if ([string]::IsNullOrWhiteSpace($playit)) {

            throw "Playit executable could not be found."
          }

          Write-Host "Playit executable:"
          Write-Host $playit

          "PLAYIT_EXE=$playit" >> $env:GITHUB_ENV

      # ============================================================
      # PLAYIT - START
      # ============================================================

      - name: "🚀 Start Playit and Generate Claim"
        run: |

          $ErrorActionPreference = "Continue"

          $playit = $env:PLAYIT_EXE

          if (
            [string]::IsNullOrWhiteSpace($playit) -or
            !(Test-Path $playit)
          ) {

            throw "Playit executable is unavailable."
          }

          Write-Host ""
          Write-Host "Starting Playit agent..."
          Write-Host ""

          $log =
            "$env:RUNNER_TEMP\playit.log"

          $err =
            "$env:RUNNER_TEMP\playit-error.log"

          # Start agent and keep its stdout/stderr.
          $proc =
            Start-Process `
              -FilePath $playit `
              -ArgumentList `
                "--secret_path",
                "$env:PLAYIT_DIR\agent-secret.txt" `
              -RedirectStandardOutput $log `
              -RedirectStandardError $err `
              -PassThru `
              -WindowStyle Hidden

          "PLAYIT_PID=$($proc.Id)" >> $env:GITHUB_ENV

          Write-Host "Playit PID:"
          Write-Host $proc.Id

          Start-Sleep -Seconds 5

          if ($proc.HasExited) {

            Write-Host "Playit exited."

            if (Test-Path $log) {
              Get-Content $log
            }

            if (Test-Path $err) {
              Get-Content $err
            }

            throw "Playit agent exited before claiming."
          }

          Write-Host ""
          Write-Host "Waiting for Playit claim information..."
          Write-Host ""

      # ============================================================
      # PLAYIT - SHOW CLAIM URL
      # ============================================================

      - name: "🔗 Get Playit Claim URL"
        run: |

          $ErrorActionPreference = "Continue"

          $log =
            "$env:RUNNER_TEMP\playit.log"

          $claim = $null

          for (
            $i = 0;
            $i -lt 30;
            $i++
          ) {

            if (Test-Path $log) {

              $content =
                Get-Content `
                  $log `
                  -Raw `
                  -ErrorAction SilentlyContinue

              if ($content) {

                Write-Host $content

                # Detect the normal playit claim URL.
                $match =
                  [regex]::Match(
                    $content,
                    'https://playit\.gg/claim/[A-Za-z0-9_-]+'
                  )

                if ($match.Success) {

                  $claim =
                    $match.Value

                  break
                }
              }
            }

            Start-Sleep -Seconds 2
          }

          if ($null -eq $claim) {

            Write-Host ""
            Write-Host "Playit did not expose a claim URL in stdout yet."
            Write-Host ""

            if (Test-Path $log) {
              Get-Content $log
            }

            throw `
              "Playit claim URL was not detected. " +
              "Check the Playit agent output above."
          }

          "PLAYIT_CLAIM_URL=$claim" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "                 PLAYIT CLAIM"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host $claim
          Write-Host ""

          @"

          # 🎮 Playit Claim Required

          ## 🔗 Open this link

          **$claim**

          ### ⏸️ Workflow is waiting for you

          1. Open the Claim URL above.
          2. Sign in to Playit if required.
          3. Claim/add this agent.
          4. Return to this GitHub Actions run.
          5. The workflow will automatically continue.

          **Do not cancel the workflow.**

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # PLAYIT - WAIT FOR CLAIM
      # ============================================================

      - name: "⏸️ Wait Until Playit Is Claimed"
        run: |

          $ErrorActionPreference = "Continue"

          $playit = $env:PLAYIT_EXE

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "           WAITING FOR PLAYIT CLAIM"
          Write-Host "=================================================="
          Write-Host ""

          $claimed = $false

          # Wait up to 30 minutes.
          # This gives enough time to open the claim link manually.

          for (
            $minute = 1;
            $minute -le 30;
            $minute++
          ) {

            Write-Host (
              "[{0}] Checking Playit status..." -f
              (Get-Date -Format "HH:mm:ss")
            )

            Start-Sleep -Seconds 10

            $log =
              "$env:RUNNER_TEMP\playit.log"

            if (Test-Path $log) {

              $content =
                Get-Content `
                  $log `
                  -Raw `
                  -ErrorAction SilentlyContinue

              # A claimed agent normally starts reporting
              # connection/control/tunnel activity.

              if (
                $content -match
                "connected|online|registered|agent"
              ) {

                Write-Host ""
                Write-Host "Playit is reporting active agent state."

                $claimed = $true
                break
              }
            }

            # Check whether the Playit process is still alive.
            $process =
              Get-Process `
                -Id $env:PLAYIT_PID `
                -ErrorAction SilentlyContinue

            if ($null -eq $process) {

              Write-Host ""
              Write-Host "Playit process stopped."

              if (Test-Path $log) {
                Get-Content $log
              }

              throw "Playit agent stopped before claim completed."
            }

            # Give GitHub visible progress.
            Write-Host (
              "Waiting... {0}/30 minutes" -f
              $minute
            )
          }

          if (!$claimed) {

            Write-Host ""
            Write-Host "Playit was not confirmed as claimed."

            throw `
              "Claim timeout reached. " +
              "Claim Playit and run the workflow again."
          }

          Write-Host ""
          Write-Host "Playit claim appears to be complete."

          @"

          ## ✅ Playit Claimed

          The Playit agent is now active.

          Continuing with Windows remote-access setup...

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # RDP
      # ============================================================

      - name: "🔐 Configure RDP"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          if (
            [string]::IsNullOrWhiteSpace(
              $env:RDP_PASSWORD
            )
          ) {

            throw "RDP_PASSWORD secret is missing."
          }

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          Write-Host "Enabling RDP..."

          Set-ItemProperty `
            -Path `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          if (
            (Get-Service TermService).Status -ne "Running"
          ) {

            Start-Service TermService
          }

          $secure =
            ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $existing =
            Get-LocalUser `
              -Name $env:RDP_USER `
              -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name $env:RDP_USER `
              -Password $secure `
              -FullName "amiraliali3" `
              -Description "Temporary RDP user" `
              -PasswordNeverExpires `
              -AccountNeverExpires |
              Out-Null

          }
          else {

            Set-LocalUser `
              -Name $env:RDP_USER `
              -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Write-Host "RDP configured."

      # ============================================================
      # FILEZILLA
      # ============================================================

      - name: "📁 Install FileZilla"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey is unavailable."
          }

          & $choco install filezilla `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "FileZilla installation failed."
          }

          Write-Host "FileZilla installed."

      # ============================================================
      # NOTEPAD++
      # ============================================================

      - name: "📝 Install Notepad++"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          & $choco install notepadplusplus.install `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Notepad++ installation failed."
          }

          Write-Host "Notepad++ installed."

      # ============================================================
      # ANYDESK
      # ============================================================

      - name: "🟢 Install AnyDesk"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          if (
            [string]::IsNullOrWhiteSpace(
              $env:RDP_PASSWORD
            )
          ) {

            throw "RDP_PASSWORD secret is missing."
          }

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $url =
            "https://download.anydesk.com/AnyDesk.exe"

          $installer =
            "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          $installDir =
            "C:\Program Files (x86)\AnyDesk"

          New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

          $p =
            Start-Process `
              -FilePath $installer `
              -ArgumentList `
                "--install",
                "`"$installDir`"",
                "--start-with-win",
                "--silent" `
              -Wait `
              -PassThru

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $anydesk =
            "$installDir\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {

            $anydesk =
              Get-ChildItem `
                "$env:ProgramFiles",
                "${env:ProgramFiles(x86)}" `
                -Filter "AnyDesk.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (
            [string]::IsNullOrWhiteSpace($anydesk)
          ) {

            throw "AnyDesk executable was not found."
          }

          "ANYDESK_PATH=$anydesk" >> $env:GITHUB_ENV

          Start-Process `
            -FilePath $anydesk `
            -ArgumentList "--start" `
            -WindowStyle Hidden `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          # Configure unattended password.
          # Password is supplied through stdin and never printed.

          $bytes =
            [Text.Encoding]::UTF8.GetBytes(
              $env:RDP_PASSWORD
            )

          $psi =
            New-Object System.Diagnostics.ProcessStartInfo

          $psi.FileName = $anydesk
          $psi.Arguments = "--set-password"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $proc =
            New-Object System.Diagnostics.Process

          $proc.StartInfo = $psi

          $proc.Start() | Out-Null

          $proc.StandardInput.WriteLine(
            $env:RDP_PASSWORD
          )

          $proc.StandardInput.Close()

          $proc.WaitForExit(15000) | Out-Null

          if (!$proc.HasExited) {
            $proc.Kill()
          }

          Write-Host "AnyDesk installed."

      # ============================================================
      # ANYDESK ID
      # ============================================================

      - name: "🆔 Get AnyDesk ID"
        run: |

          $ErrorActionPreference = "Continue"

          $anydesk =
            $env:ANYDESK_PATH

          if (
            [string]::IsNullOrWhiteSpace($anydesk) -or
            !(Test-Path $anydesk)
          ) {

            "ANYDESK_ID=unavailable" >> $env:GITHUB_ENV

            exit 0
          }

          Start-Sleep -Seconds 5

          $id =
            & $anydesk --get-id 2>$null |
            Out-String

          $id =
            $id.Trim()

          if (
            [string]::IsNullOrWhiteSpace($id)
          ) {

            $id = "unavailable"
          }

          "ANYDESK_ID=$id" >> $env:GITHUB_ENV

          Write-Host "AnyDesk ID: $id"

      # ============================================================
      # TIGHTVNC
      # ============================================================

      - name: "🖥️ Install VNC Server"
        run: |

          $ErrorActionPreference = "Continue"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          & $choco install tightvnc `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {

            Write-Warning `
              "TightVNC installation failed."

            "VNC_STATUS=failed" >> $env:GITHUB_ENV

            exit 0
          }

          $service =
            Get-Service `
              -Name tvnserver `
              -ErrorAction SilentlyContinue

          if ($null -ne $service) {

            Set-Service `
              -Name tvnserver `
              -StartupType Automatic

            Start-Service `
              -Name tvnserver `
              -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 5

          $listener =
            Get-NetTCPConnection `
              -LocalPort 5900 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $listener) {

            Write-Warning `
              "VNC server is not listening on 5900."

            "VNC_STATUS=not-listening" >> $env:GITHUB_ENV
          }
          else {

            Write-Host "VNC is listening on 5900."

            "VNC_STATUS=running" >> $env:GITHUB_ENV
          }

      # ============================================================
      # NOVNC
      # ============================================================

      - name: "🌐 Install noVNC"
        run: |

          $ErrorActionPreference = "Stop"

          if (Test-Path $env:NOVNC_DIR) {

            Remove-Item `
              $env:NOVNC_DIR `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $env:NOVNC_DIR

          python -m pip install `
            --upgrade `
            websockify

          if (!(Test-Path "$env:NOVNC_DIR\vnc.html")) {

            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # START NOVNC
      # ============================================================

      - name: "🌐 Start noVNC"
        run: |

          $ErrorActionPreference = "Continue"

          $vnc =
            Get-NetTCPConnection `
              -LocalPort 5900 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $vnc) {

            Write-Warning `
              "No VNC server is listening."

            "NOVNC_STATUS=no-backend" >> $env:GITHUB_ENV

            exit 0
          }

          $log =
            "$env:RUNNER_TEMP\novnc.log"

          $err =
            "$env:RUNNER_TEMP\novnc-error.log"

          Start-Process `
            -FilePath "websockify.exe" `
            -ArgumentList `
              "6080",
              "127.0.0.1:5900",
              "--web",
              "$env:NOVNC_DIR" `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $web =
            Get-NetTCPConnection `
              -LocalPort 6080 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $web) {

            Write-Warning `
              "noVNC did not start."

            if (Test-Path $err) {
              Get-Content $err
            }

            "NOVNC_STATUS=failed" >> $env:GITHUB_ENV

            exit 0
          }

          "NOVNC_STATUS=running" >> $env:GITHUB_ENV

          Write-Host "noVNC running on port 6080."

      # ============================================================
      # FINAL NETWORK INFORMATION
      # ============================================================

      - name: "📋 Remote Access Summary"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Continue"

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $ips =
            Get-NetIPAddress `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -notlike "127.*" -and
              $_.IPAddress -notlike "169.254.*"
            } |
            Select-Object -ExpandProperty IPAddress

          $ip =
            ($ips | Select-Object -First 1)

          @"

          # 🖥️ Windows Server 2025

          ## 🎮 Playit

          **Agent:** Claimed

          **Claim URL:**
          $env:PLAYIT_CLAIM_URL

          **Important:** Playit must have a tunnel configured in your Playit account. The local target for noVNC is:

          `127.0.0.1:6080`

          ## 🔐 RDP

          **IP:**
          `$ip:3389`

          **Username:**
          `amiraliali3`

          **Password:**
          `RDP_PASSWORD`

          ## 🟢 AnyDesk

          **AnyDesk ID:**
          `$env:ANYDESK_ID`

          **Password:**
          Same value as `RDP_PASSWORD`

          ## 🌐 noVNC

          **Local WebSocket:**
          `127.0.0.1:6080`

          **VNC backend:**
          `127.0.0.1:5900`

          **Playit target:**
          `127.0.0.1:6080`

          **Status:**
          `$env:NOVNC_STATUS`

          ## 📁 Applications

          - FileZilla
          - Notepad++
          - AnyDesk
          - TightVNC
          - noVNC
          - Websockify

          ## ⏱️ Runtime

          **5 hours**

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: "⏱️ Keep Online For 5 Hours"
        run: |

          $ErrorActionPreference = "Continue"

          $totalSeconds =
            5 * 60 * 60

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              REMOTE SERVER READY"
          Write-Host "              RUNTIME: 5 HOURS"
          Write-Host "=================================================="

          for (
            $i = 0;
            $i -lt $totalSeconds;
            $i++
          ) {

            if (($i % 60) -eq 0) {

              $remaining =
                $totalSeconds - $i

              $hours =
                [math]::Floor(
                  $remaining / 3600
                )

              $minutes =
                [math]::Floor(
                  ($remaining % 3600) / 60
                )

              Write-Host (
                "[{0}] Remaining: {1}h {2}m" -f
                (Get-Date -Format "HH:mm:ss"),
                $hours,
                $minutes
              )
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5-hour runtime completed."
