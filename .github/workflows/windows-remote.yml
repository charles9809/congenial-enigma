name: Windows 2025 - Playit noVNC Remote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-2025-playit-novnc
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:

  windows-remote:

    name: Windows Server 2025 - Playit noVNC

    runs-on: windows-2025

    timeout-minutes: 300

    env:
      RDP_USER: amiraliali3

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: "🖥️ System Information"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        WINDOWS SERVER 2025"
          Write-Host "=================================================="

          $os = Get-ComputerInfo

          Write-Host "OS:"
          Write-Host $os.WindowsProductName

          Write-Host "Version:"
          Write-Host $os.WindowsVersion

          Write-Host "Architecture:"
          Write-Host $os.OsArchitecture

          Write-Host ""
          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"

          $ram = Get-CimInstance Win32_ComputerSystem

          Write-Host (
            "{0:N2} GB" -f
            ($ram.TotalPhysicalMemory / 1GB)
          )

      # ============================================================
      # CHOCOLATEY
      # ============================================================

      - name: "📦 Verify Chocolatey"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey is not available."
          }

          Write-Host "Chocolatey version:"
          & $choco --version

      # ============================================================
      # FILEZILLA
      # ============================================================

      - name: "📁 Install FileZilla"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          Write-Host "Installing FileZilla..."

          & $choco install filezilla `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "FileZilla installation failed."
          }

          $paths = @(
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "${env:ProgramFiles(x86)}\FileZilla FTP Client\filezilla.exe"
          )

          $found = $null

          foreach ($path in $paths) {

            if (Test-Path $path) {
              $found = $path
              break
            }
          }

          if ($null -eq $found) {
            throw "FileZilla executable was not found."
          }

          Write-Host "FileZilla installed:"
          Write-Host $found

          "FILEZILLA_PATH=$found" >> $env:GITHUB_ENV

      # ============================================================
      # NOTEPAD++
      # ============================================================

      - name: "📝 Install Notepad++"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          Write-Host "Installing Notepad++..."

          & $choco install notepadplusplus.install `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Notepad++ installation failed."
          }

          $paths = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "${env:ProgramFiles(x86)}\Notepad++\notepad++.exe"
          )

          $found = $null

          foreach ($path in $paths) {

            if (Test-Path $path) {
              $found = $path
              break
            }
          }

          if ($null -eq $found) {
            throw "Notepad++ executable was not found."
          }

          Write-Host "Notepad++ installed:"
          Write-Host $found

          "NOTEPADPP_PATH=$found" >> $env:GITHUB_ENV

      # ============================================================
      # AVICA
      #
      # IMPORTANT:
      # NO CHOCOLATEY INSTALLATION IS USED HERE.
      # ============================================================

      - name: "🖥️ Avica Check"
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "                 AVICA CHECK"
          Write-Host "=================================================="

          $paths = @(
            "$env:ProgramFiles\Avica\Avica.exe",
            "${env:ProgramFiles(x86)}\Avica\Avica.exe",
            "$env:LOCALAPPDATA\Programs\Avica\Avica.exe",
            "$env:ProgramFiles\Avica\AvicaClient.exe",
            "${env:ProgramFiles(x86)}\Avica\AvicaClient.exe"
          )

          $found = $null

          foreach ($path in $paths) {

            if (Test-Path $path) {

              $found = $path

              break
            }
          }

          if ($null -ne $found) {

            Write-Host "Avica found:"
            Write-Host $found

            "AVICA_STATUS=installed" >> $env:GITHUB_ENV
            "AVICA_PATH=$found" >> $env:GITHUB_ENV

          }
          else {

            Write-Host "Avica is not currently installed."
            Write-Host "Skipping Avica without failing the workflow."

            "AVICA_STATUS=not-installed" >> $env:GITHUB_ENV
          }

      # ============================================================
      # RDP
      # ============================================================

      - name: "🔐 Enable Remote Desktop"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "Enabling RDP..."

          Set-ItemProperty `
            -Path `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 2 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          if (
            (Get-Service TermService).Status -ne "Running"
          ) {

            Start-Service TermService
          }

          Start-Sleep -Seconds 3

          $listener =
            Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            throw "RDP is not listening on TCP 3389."
          }

          Write-Host "RDP is ready."

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: "👤 Configure RDP Account"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          if (
            [string]::IsNullOrWhiteSpace(
              $env:RDP_PASSWORD
            )
          ) {

            throw "RDP_PASSWORD secret is missing."
          }

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $username =
            $env:RDP_USER

          $securePassword =
            ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $user =
            Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "amiraliali3" `
              -Description "Temporary RDP account" `
              -PasswordNeverExpires `
              -AccountNeverExpires |
              Out-Null

            Write-Host "RDP user created."

          }
          else {

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Write-Host "RDP password updated."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP username:"
          Write-Host $username

      # ============================================================
      # PYTHON
      # ============================================================

      - name: "🐍 Install Python"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "C:\ProgramData\chocolatey\bin\choco.exe"

          & $choco install python `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Python installation failed."
          }

          $python =
            Get-Command python.exe `
              -ErrorAction SilentlyContinue

          if ($null -eq $python) {
            throw "Python executable was not found."
          }

          python --version

      # ============================================================
      # NOVNC
      # ============================================================

      - name: "🌐 Install noVNC"
        run: |

          $ErrorActionPreference = "Stop"

          $root = "C:\noVNC"

          if (Test-Path $root) {

            Remove-Item `
              $root `
              -Recurse `
              -Force
          }

          Write-Host "Downloading noVNC..."

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $root

          if (!(Test-Path "$root\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # WEBSOCKIFY
      # ============================================================

      - name: "🔌 Install Websockify"
        run: |

          $ErrorActionPreference = "Stop"

          python -m pip install `
            --upgrade `
            pip

          python -m pip install `
            websockify

          $cmd =
            Get-Command websockify `
              -ErrorAction SilentlyContinue

          if ($null -eq $cmd) {

            $cmd =
              Get-Command websockify.exe `
                -ErrorAction SilentlyContinue
          }

          if ($null -eq $cmd) {
            throw "Websockify installation failed."
          }

          Write-Host "Websockify installed:"
          Write-Host $cmd.Source

      # ============================================================
      # VNC SERVER DETECTION
      # ============================================================

      - name: "🖥️ Detect VNC Server"
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "Checking VNC server..."

          $vnc =
            Get-NetTCPConnection `
              -LocalPort 5900 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -ne $vnc) {

            Write-Host "VNC detected on port 5900."

            "VNC_STATUS=running" >> $env:GITHUB_ENV

          }
          else {

            Write-Warning `
              "No VNC server is listening on port 5900."

            Write-Warning `
              "noVNC will remain installed but cannot display"
            Write-Warning `
              "the desktop until a VNC server is available."

            "VNC_STATUS=not-running" >> $env:GITHUB_ENV
          }

      # ============================================================
      # START NOVNC
      # ============================================================

      - name: "🌐 Start noVNC"
        run: |

          $ErrorActionPreference = "Continue"

          $vncPort = 5900
          $webPort = 6080

          $vnc =
            Get-NetTCPConnection `
              -LocalPort $vncPort `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $vnc) {

            Write-Warning `
              "VNC server unavailable."

            Write-Warning `
              "Skipping Websockify."

            "NOVNC_STATUS=waiting-for-vnc" >> $env:GITHUB_ENV

            exit 0
          }

          $existing =
            Get-NetTCPConnection `
              -LocalPort $webPort `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -ne $existing) {

            Write-Host "noVNC already running."

            "NOVNC_STATUS=running" >> $env:GITHUB_ENV

            exit 0
          }

          $log =
            "$env:RUNNER_TEMP\novnc.log"

          $err =
            "$env:RUNNER_TEMP\novnc-error.log"

          $arguments = @(
            "6080",
            "127.0.0.1:5900",
            "--web",
            "C:\noVNC"
          )

          Write-Host "Starting Websockify..."

          Start-Process `
            -FilePath "websockify.exe" `
            -ArgumentList $arguments `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          $web =
            Get-NetTCPConnection `
              -LocalPort $webPort `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $web) {

            Write-Warning "Websockify did not start."

            if (Test-Path $log) {
              Get-Content $log
            }

            if (Test-Path $err) {
              Get-Content $err
            }

            "NOVNC_STATUS=failed" >> $env:GITHUB_ENV

            exit 0
          }

          Write-Host "noVNC is running on port 6080."

          "NOVNC_STATUS=running" >> $env:GITHUB_ENV

      # ============================================================
      # PLAYIT PREPARATION
      # ============================================================

      - name: "🌐 Prepare Playit"
        run: |

          $ErrorActionPreference = "Stop"

          $dir = "C:\playit"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "                    PLAYIT"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Official download:"
          Write-Host "https://playit.gg/download/"

          Write-Host ""
          Write-Host "noVNC local endpoint:"
          Write-Host "127.0.0.1:6080"

          @"

          ## 🌐 Playit

          Configure your Playit tunnel to:

          `127.0.0.1:6080`

          Official Playit:

          https://playit.gg/download/

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # DESKTOP SCREENSHOT
      # ============================================================

      - name: "📸 Capture Desktop Screenshot"
        run: |

          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screens =
            [System.Windows.Forms.Screen]::AllScreens

          if (
            $null -eq $screens -or
            $screens.Count -eq 0
          ) {
            throw "No display detected."
          }

          $left =
            ($screens |
              ForEach-Object {
                $_.Bounds.Left
              } |
              Measure-Object -Minimum).Minimum

          $top =
            ($screens |
              ForEach-Object {
                $_.Bounds.Top
              } |
              Measure-Object -Minimum).Minimum

          $right =
            ($screens |
              ForEach-Object {
                $_.Bounds.Right
              } |
              Measure-Object -Maximum).Maximum

          $bottom =
            ($screens |
              ForEach-Object {
                $_.Bounds.Bottom
              } |
              Measure-Object -Maximum).Maximum

          [int]$width =
            [math]::Max(
              1,
              [int]($right - $left)
            )

          [int]$height =
            [math]::Max(
              1,
              [int]($bottom - $top)
            )

          Write-Host ""
          Write-Host "Desktop size: ${width}x${height}"

          $file =
            Join-Path `
              $env:GITHUB_WORKSPACE `
              "desktop-screenshot.png"

          $bitmap = $null
          $graphics = $null

          try {

            $bitmap =
              New-Object `
                System.Drawing.Bitmap(
                  $width,
                  $height,
                  [System.Drawing.Imaging.PixelFormat]::Format32bppArgb
                )

            $graphics =
              [System.Drawing.Graphics]::FromImage(
                $bitmap
              )

            $graphics.CopyFromScreen(
              $left,
              $top,
              0,
              0,
              [System.Drawing.Size]::new(
                $width,
                $height
              ),
              [System.Drawing.CopyPixelOperation]::SourceCopy
            )

            $bitmap.Save(
              $file,
              [System.Drawing.Imaging.ImageFormat]::Png
            )

          }
          finally {

            if ($graphics) {
              $graphics.Dispose()
            }

            if ($bitmap) {
              $bitmap.Dispose()
            }
          }

          if (!(Test-Path $file)) {
            throw "Screenshot was not created."
          }

          Write-Host "Screenshot created successfully."

      # ============================================================
      # UPLOAD SCREENSHOT
      # ============================================================

      - name: "📦 Upload Desktop Screenshot"
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-desktop
          path: desktop-screenshot.png
          retention-days: 1

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: "📋 Create GitHub Summary"
        run: |

          $ErrorActionPreference = "Continue"

          $avica =
            if ($env:AVICA_STATUS) {
              $env:AVICA_STATUS
            }
            else {
              "not-installed"
            }

          $vnc =
            if ($env:VNC_STATUS) {
              $env:VNC_STATUS
            }
            else {
              "unknown"
            }

          $novnc =
            if ($env:NOVNC_STATUS) {
              $env:NOVNC_STATUS
            }
            else {
              "unknown"
            }

          @"

          # 🖥️ Windows Server 2025

          ## 📦 Applications

          | Application | Status |
          |---|---|
          | FileZilla | 🟢 Installed |
          | Notepad++ | 🟢 Installed |
          | Avica | $avica |
          | VNC Server | $vnc |
          | noVNC | $novnc |
          | Playit | 🟡 Ready |

          ## 🔐 RDP

          **Username:** `amiraliali3`

          **Password:** `RDP_PASSWORD`

          **Port:** `3389`

          ## 🌐 noVNC

          Local endpoint:

          `127.0.0.1:6080`

          Playit should forward to this endpoint.

          ## 📸 Screenshot

          Download the artifact:

          `windows-2025-desktop`

          ## ⏱️ Runtime

          **5 hours**

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================

      - name: "⏱️ Keep Runner Alive - 5 Hours"
        run: |

          $ErrorActionPreference = "Continue"

          $totalSeconds =
            5 * 60 * 60

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        WINDOWS SERVER IS READY"
          Write-Host "        RUNTIME: 5 HOURS"
          Write-Host "=================================================="
          Write-Host ""

          for (
            $i = 0;
            $i -lt $totalSeconds;
            $i++
          ) {

            if (($i % 60) -eq 0) {

              $remaining =
                $totalSeconds - $i

              $hours =
                [math]::Floor(
                  $remaining / 3600
                )

              $minutes =
                [math]::Floor(
                  ($remaining % 3600) / 60
                )

              Write-Host (
                "[{0}] Remaining: {1}h {2}m" -f
                (Get-Date -Format "HH:mm:ss"),
                $hours,
                $minutes
              )
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5-hour runtime completed."
