name: Windows 2025 - Tailscale Remote

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-remote:
    name: Windows Server 2025
    runs-on: windows-2025

    # 5 hours
    timeout-minutes: 300

    steps:

      # ============================================================
      # SYSTEM INFO
      # ============================================================

      - name: System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Windows Server 2025"
          Write-Host "=============================================="

          Get-ComputerInfo |
            Select-Object `
              WindowsProductName,
              WindowsVersion,
              OsArchitecture

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          "{0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB)

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (!(Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale status:"
          & $tailscale status

          Start-Sleep -Seconds 5

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale connected successfully."

      # ============================================================
      # FILEZILLA
      # ============================================================

      - name: Install FileZilla
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Installing FileZilla"
          Write-Host "=============================================="

          $choco = "C:\ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey is not installed on this Windows runner."
          }

          & $choco install filezilla `
            --yes `
            --no-progress

          $exitCode = $LASTEXITCODE

          Write-Host "Chocolatey exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "FileZilla installation failed. Chocolatey exit code: $exitCode"
          }

          Write-Host "FileZilla installation completed."

      # ============================================================
      # VERIFY FILEZILLA
      # ============================================================

      - name: Verify FileZilla
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "${env:ProgramFiles(x86)}\FileZilla FTP Client\filezilla.exe"
          )

          $found = $false

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "FileZilla found:"
              Write-Host $path
              $found = $true
              break
            }
          }

          if (!$found) {

            $found = Get-ChildItem `
              "$env:ProgramFiles" `
              -Filter "filezilla.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          }

          if (!$found) {
            throw "FileZilla executable was not found after installation."
          }

          Write-Host "FileZilla verification successful."

      # ============================================================
      # NOTEPAD++
      # ============================================================

      - name: Install Notepad++
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Installing Notepad++"
          Write-Host "=============================================="

          # Current verified x64 release
          $version = "8.9.7"

          $url = "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v$version/npp.$version.Installer.x64.exe"

          $installer = Join-Path `
            $env:TEMP `
            "NotepadPlusPlus-$version-x64.exe"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Notepad++ installer was not downloaded."
          }

          Write-Host "Installer downloaded."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -NoNewWindow

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Notepad++ installation completed."

      # ============================================================
      # VERIFY NOTEPAD++
      # ============================================================

      - name: Verify Notepad++
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "${env:ProgramFiles(x86)}\Notepad++\notepad++.exe"
          )

          $found = $false

          foreach ($path in $paths) {

            if (Test-Path $path) {

              Write-Host "Notepad++ found:"
              Write-Host $path

              $found = $true

              break
            }
          }

          if (!$found) {
            throw "Notepad++ executable was not found."
          }

          Write-Host "Notepad++ verification successful."

      # ============================================================
      # ENABLE RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Enabling Remote Desktop"
          Write-Host "=============================================="

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          if ((Get-Service TermService).Status -ne "Running") {
            Start-Service TermService
          }

          Write-Host "RDP enabled successfully."

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "remoteuser"

          if ([string]::IsNullOrWhiteSpace("${{ secrets.RDP_PASSWORD }}")) {
            throw "RDP_PASSWORD secret is missing."
          }

          $password = ConvertTo-SecureString `
            "${{ secrets.RDP_PASSWORD }}" `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name $username `
              -Password $password `
              -FullName "Temporary Remote User" `
              -Description "Temporary GitHub Actions RDP account" `
              -PasswordNeverExpires

            Write-Host "RDP user created."

          } else {

            Set-LocalUser `
              -Name $username `
              -Password $password

            Write-Host "RDP user already existed. Password updated."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      # ============================================================
      # WAIT
      # ============================================================

      - name: Prepare Desktop
        shell: powershell
        run: |
          Write-Host "Waiting for Windows desktop..."

          Start-Sleep -Seconds 20

      # ============================================================
      # SCREENSHOT BEFORE IP DISPLAY
      # ============================================================

      - name: Capture Desktop Screenshot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Capturing Desktop"
          Write-Host "=============================================="

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screens = [System.Windows.Forms.Screen]::AllScreens

          if ($screens.Count -eq 0) {
            throw "No display detected."
          }

          $left = (
            $screens |
            ForEach-Object { $_.Bounds.Left } |
            Measure-Object -Minimum
          ).Minimum

          $top = (
            $screens |
            ForEach-Object { $_.Bounds.Top } |
            Measure-Object -Minimum
          ).Minimum

          $right = (
            $screens |
            ForEach-Object { $_.Bounds.Right } |
            Measure-Object -Maximum
          ).Maximum

          $bottom = (
            $screens |
            ForEach-Object { $_.Bounds.Bottom } |
            Measure-Object -Maximum
          ).Maximum

          $width = $right - $left
          $height = $bottom - $top

          Write-Host "Resolution: ${width}x${height}"

          $bitmap = New-Object `
            System.Drawing.Bitmap `
            $width,
            $height

          $graphics = `
            [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $left,
            $top,
            0,
            0,
            $bitmap.Size
          )

          $screenshot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "desktop-before-ip.png"

          $bitmap.Save(
            $screenshot,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          if (!(Test-Path $screenshot)) {
            throw "Screenshot creation failed."
          }

          Write-Host ""
          Write-Host "Screenshot successfully created:"
          Write-Host $screenshot

      # ============================================================
      # UPLOAD SCREENSHOT
      # ============================================================

      - name: Upload Desktop Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-desktop-screenshot
          path: desktop-before-ip.png
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # GITHUB SUMMARY
      # ============================================================

      - name: Create GitHub Actions Summary
        shell: powershell
        env:
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          RUN_ID: ${{ github.run_id }}
          SERVER_NAME: ${{ github.repository }}
        run: |
          $summary = @"
          # 🖥️ Windows Server 2025

          ## 🟢 Server Status

          | Component | Status |
          |---|---|
          | Operating System | 🟢 Windows Server 2025 |
          | Tailscale | 🟢 Connected |
          | FileZilla | 🟢 Installed |
          | Notepad++ | 🟢 Installed |
          | Remote Desktop | 🟢 Enabled |
          | Runtime | ⏱️ 5 Hours |

          ## 📸 Desktop Screenshot

          Screenshot was captured **before the Tailscale IP was displayed**.

          **[📥 Open Screenshot Artifact](../../actions/runs/$env:RUN_ID)**

          Artifact name:

          `windows-2025-desktop-screenshot`

          ## 🔐 RDP

          ### Tailscale IPv4

          ```
          $env:TAILSCALE_IP
          ```

          ### RDP Address

          ```
          $env:TAILSCALE_IP`:3389
          ```

          ### Username

          ```
          remoteuser
          ```

          ### Password

          The password is stored in:

          ```
          RDP_PASSWORD
          ```

          ## ⏱️ Runtime

          The runner will remain active for approximately **5 hours**.

          ## ⚠️ Important

          This is a temporary GitHub-hosted runner.

          When the workflow ends, GitHub destroys the VM.

          "@

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8

      # ============================================================
      # DISPLAY IP
      # ============================================================

      - name: Show Remote Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "===================================================="
          Write-Host "        WINDOWS SERVER 2025 REMOTE ACCESS"
          Write-Host "===================================================="
          Write-Host ""

          Write-Host "Tailscale IPv4:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""

          Write-Host "RDP Address:"
          Write-Host "$($env:TAILSCALE_IP):3389"

          Write-Host ""

          Write-Host "Username:"
          Write-Host "remoteuser"

          Write-Host ""

          Write-Host "Password:"
          Write-Host "Use GitHub Secret: RDP_PASSWORD"

          Write-Host ""

          Write-Host "===================================================="

      # ============================================================
      # KEEP ALIVE 5 HOURS
      # ============================================================

      - name: Keep Server Online For 5 Hours
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $totalSeconds = 5 * 60 * 60

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " Windows Server 2025 is ONLINE"
          Write-Host " Runtime: 5 Hours"
          Write-Host "=============================================="
          Write-Host ""

          for ($i = 0; $i -lt $totalSeconds; $i++) {

            if (($i % 60) -eq 0) {

              $remaining = $totalSeconds - $i

              $hours = [math]::Floor(
                $remaining / 3600
              )

              $minutes = [math]::Floor(
                ($remaining % 3600) / 60
              )

              Write-Host "Remaining: ${hours}h ${minutes}m"
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5-hour runtime completed."

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup Tailscale
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up Tailscale..."

          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (Test-Path $tailscale) {
            try {
              & $tailscale logout
              Write-Host "Tailscale logout completed."
            }
            catch {
              Write-Host "Tailscale cleanup completed."
            }
          }
