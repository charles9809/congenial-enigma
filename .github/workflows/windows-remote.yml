name: Windows 2025 - Playit noVNC Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-2025-playit-novnc
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:

  windows-remote:

    name: Windows Server 2025 - Playit noVNC

    runs-on: windows-2025

    timeout-minutes: 300

    env:
      RDP_USER: amiraliali3

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: "🖥️ System Information"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        WINDOWS SERVER 2025"
          Write-Host "=================================================="

          $os = Get-ComputerInfo

          Write-Host "OS:"
          Write-Host $os.WindowsProductName

          Write-Host ""
          Write-Host "Version:"
          Write-Host $os.WindowsVersion

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host $os.OsArchitecture

          Write-Host ""
          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"

          $ram = Get-CimInstance Win32_ComputerSystem

          Write-Host (
            "{0:N2} GB" -f
            ($ram.TotalPhysicalMemory / 1GB)
          )

      # ============================================================
      # CHOCOLATEY CHECK
      # ============================================================

      - name: "📦 Verify Chocolatey"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "$env:ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey is not available on this runner."
          }

          Write-Host "Chocolatey:"
          & $choco --version

      # ============================================================
      # FILEZILLA
      # ============================================================

      - name: "📁 Install FileZilla"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "$env:ProgramData\chocolatey\bin\choco.exe"

          & $choco install filezilla `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "FileZilla installation failed."
          }

          $paths = @(
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "${env:ProgramFiles(x86)}\FileZilla FTP Client\filezilla.exe"
          )

          $found = $paths |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (!$found) {
            throw "FileZilla executable was not found."
          }

          Write-Host "FileZilla:"
          Write-Host $found

      # ============================================================
      # NOTEPAD++
      # ============================================================

      - name: "📝 Install Notepad++"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "$env:ProgramData\chocolatey\bin\choco.exe"

          & $choco install notepadplusplus.install `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Notepad++ installation failed."
          }

          $paths = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "${env:ProgramFiles(x86)}\Notepad++\notepad++.exe"
          )

          $found = $paths |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (!$found) {
            throw "Notepad++ executable was not found."
          }

          Write-Host "Notepad++:"
          Write-Host $found

      # ============================================================
      # AVICA
      # ============================================================

      - name: "🖥️ Install Avica"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "Searching Chocolatey for Avica..."

          $choco =
            "$env:ProgramData\chocolatey\bin\choco.exe"

          $search =
            & $choco search avica --exact 2>&1

          Write-Host $search

          if (
            $search -match "No packages found"
          ) {
            Write-Host ""
            Write-Host "Avica is not available as an exact"
            Write-Host "Chocolatey package on this runner."
            Write-Host ""
            Write-Host "Skipping automatic Avica installation."
            Write-Host "This prevents the workflow from failing."
          }
          else {

            & $choco install avica `
              --yes `
              --no-progress

            if ($LASTEXITCODE -ne 0) {
              Write-Warning `
                "Avica package installation failed."
            }
          }

      # ============================================================
      # RDP
      # ============================================================

      - name: "🔐 Enable Secure RDP"
        run: |

          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path `
              "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 2 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          if (
            (Get-Service TermService).Status -ne "Running"
          ) {
            Start-Service TermService
          }

          Start-Sleep -Seconds 3

          $listener =
            Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            throw "RDP is not listening on TCP 3389."
          }

          Write-Host "Secure RDP is ready."

      # ============================================================
      # RDP USER
      # ============================================================

      - name: "👤 Configure RDP User"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          if (
            [string]::IsNullOrWhiteSpace(
              $env:RDP_PASSWORD
            )
          ) {
            throw "RDP_PASSWORD secret is missing."
          }

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $username =
            $env:RDP_USER

          $securePassword =
            ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $existing =
            Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName $username `
              -Description "Temporary Windows remote user" `
              -PasswordNeverExpires `
              -AccountNeverExpires |
              Out-Null

          }
          else {

            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured:"
          Write-Host $username

      # ============================================================
      # INSTALL PYTHON
      # ============================================================

      - name: "🐍 Install Python"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "$env:ProgramData\chocolatey\bin\choco.exe"

          & $choco install python `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Python installation failed."
          }

          $python =
            Get-Command python.exe `
              -ErrorAction SilentlyContinue

          if ($null -eq $python) {
            throw "Python executable not found."
          }

          python --version

      # ============================================================
      # DOWNLOAD NOVNC
      # ============================================================

      - name: "🌐 Install noVNC"
        run: |

          $ErrorActionPreference = "Stop"

          $root =
            "C:\noVNC"

          if (Test-Path $root) {
            Remove-Item `
              $root `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $root

          if (!(Test-Path "$root\vnc.html")) {
            throw "noVNC installation failed."
          }

          Write-Host "noVNC installed."

      # ============================================================
      # INSTALL WEBSOCKIFY
      # ============================================================

      - name: "🔌 Install Websockify"
        run: |

          $ErrorActionPreference = "Stop"

          python -m pip install `
            --upgrade `
            pip

          python -m pip install `
            websockify

          $websockify =
            Get-Command websockify.exe `
              -ErrorAction SilentlyContinue

          if ($null -eq $websockify) {

            $websockify =
              Get-Command websockify `
                -ErrorAction SilentlyContinue
          }

          if ($null -eq $websockify) {
            throw "Websockify was not installed."
          }

          Write-Host "Websockify installed:"
          Write-Host $websockify.Source

      # ============================================================
      # VNC SERVER
      #
      # IMPORTANT:
      # The VNC server itself must be installed/configured.
      # This workflow uses TightVNC if available from Chocolatey.
      # ============================================================

      - name: "🖥️ Install VNC Server"
        run: |

          $ErrorActionPreference = "Stop"

          $choco =
            "$env:ProgramData\chocolatey\bin\choco.exe"

          $search =
            & $choco search tightvnc --exact 2>&1

          Write-Host $search

          if (
            $search -match "tightvnc"
          ) {

            & $choco install tightvnc `
              --yes `
              --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "TightVNC installation failed."
            }

            Write-Host "TightVNC installed."

          }
          else {

            Write-Warning `
              "TightVNC package is not available."

            Write-Warning `
              "VNC server must be installed separately."
          }

      # ============================================================
      # LOCAL NOVNC TEST SERVER
      # ============================================================

      - name: "🧪 Start noVNC / Websockify"
        run: |

          $ErrorActionPreference = "Stop"

          $vncPort = 5900
          $webPort = 6080

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             noVNC LOCAL SERVICE"
          Write-Host "=================================================="

          $vnc =
            Get-NetTCPConnection `
              -LocalPort $vncPort `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $vnc) {

            Write-Warning `
              "No VNC server is listening on 127.0.0.1:5900."

            Write-Warning `
              "noVNC will be installed, but a VNC server"
            Write-Warning `
              "must provide the actual desktop framebuffer."

          }
          else {

            Write-Host "VNC server detected on port 5900."

            $log =
              "$env:RUNNER_TEMP\novnc.log"

            $args =
              @(
                "$webPort",
                "127.0.0.1:$vncPort",
                "--web",
                "C:\noVNC"
              )

            Start-Process `
              -FilePath "websockify.exe" `
              -ArgumentList $args `
              -RedirectStandardOutput $log `
              -RedirectStandardError "$log.err" `
              -WindowStyle Hidden

            Start-Sleep -Seconds 5

            $web =
              Get-NetTCPConnection `
                -LocalPort $webPort `
                -State Listen `
                -ErrorAction SilentlyContinue

            if ($null -eq $web) {
              throw "noVNC/Websockify failed to start."
            }

            Write-Host `
              "noVNC listening on localhost:$webPort"
          }

      # ============================================================
      # PLAYIT
      # ============================================================

      - name: "🌐 Install Playit Agent"
        run: |

          $ErrorActionPreference = "Stop"

          $dir =
            "C:\playit"

          New-Item `
            -ItemType Directory `
            -Path $dir `
            -Force |
            Out-Null

          Write-Host "Opening official Playit download page..."

          $page =
            Invoke-WebRequest `
              -Uri "https://playit.gg/download/" `
              -UseBasicParsing

          if ($page.StatusCode -ne 200) {
            throw "Unable to access Playit download page."
          }

          Write-Host ""
          Write-Host "Official Playit download:"
          Write-Host "https://playit.gg/download/"
          Write-Host ""

          @"
          ## 🌐 Playit

          Official Playit Agent:

          https://playit.gg/download/

          The Agent must be associated with your Playit account.

          Configure a Playit tunnel in your Playit dashboard:

          **Tunnel target:**

          `127.0.0.1:6080`

          This target is the noVNC WebSocket/HTTP service.

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # DESKTOP SCREENSHOT
      # ============================================================

      - name: "📸 Capture Desktop Screenshot"
        run: |

          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screens =
            [System.Windows.Forms.Screen]::AllScreens

          if ($screens.Count -lt 1) {
            throw "No display detected."
          }

          $left =
            ($screens |
              ForEach-Object {
                $_.Bounds.Left
              } |
              Measure-Object -Minimum).Minimum

          $top =
            ($screens |
              ForEach-Object {
                $_.Bounds.Top
              } |
              Measure-Object -Minimum).Minimum

          $right =
            ($screens |
              ForEach-Object {
                $_.Bounds.Right
              } |
              Measure-Object -Maximum).Maximum

          $bottom =
            ($screens |
              ForEach-Object {
                $_.Bounds.Bottom
              } |
              Measure-Object -Maximum).Maximum

          [int]$width =
            [math]::Max(
              1,
              [int]($right - $left)
            )

          [int]$height =
            [math]::Max(
              1,
              [int]($bottom - $top)
            )

          Write-Host `
            "Desktop size: ${width}x${height}"

          $file =
            Join-Path `
              $env:GITHUB_WORKSPACE `
              "desktop-screenshot.png"

          $bitmap = $null
          $graphics = $null

          try {

            $bitmap =
              New-Object System.Drawing.Bitmap(
                $width,
                $height,
                [System.Drawing.Imaging.PixelFormat]::Format32bppPArgb
              )

            $graphics =
              [System.Drawing.Graphics]::FromImage(
                $bitmap
              )

            $graphics.CopyFromScreen(
              $left,
              $top,
              0,
              0,
              [System.Drawing.Size]::new(
                $width,
                $height
              ),
              [System.Drawing.CopyPixelOperation]::SourceCopy
            )

            $bitmap.Save(
              $file,
              [System.Drawing.Imaging.ImageFormat]::Png
            )

          }
          finally {

            if ($graphics) {
              $graphics.Dispose()
            }

            if ($bitmap) {
              $bitmap.Dispose()
            }
          }

          if (!(Test-Path $file)) {
            throw "Screenshot was not created."
          }

          Write-Host "Screenshot created:"
          Write-Host $file

      # ============================================================
      # UPLOAD SCREENSHOT
      # ============================================================

      - name: "📦 Upload Desktop Screenshot"
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-desktop-screenshot
          path: desktop-screenshot.png
          retention-days: 1

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: "📋 Generate GitHub Summary"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          $rdpUser =
            $env:RDP_USER

          @"
          # 🖥️ Windows Server 2025

          ## Applications

          | Component | Status |
          |---|---|
          | Windows Server 2025 | 🟢 Running |
          | FileZilla | 🟢 Installed |
          | Notepad++ | 🟢 Installed |
          | Avica | ⚪ Check installation result |
          | VNC Server | 🟡 Check service |
          | noVNC | 🟢 Installed |
          | Playit Agent | 🟡 Configure/Claim |

          ## 🌐 noVNC

          Playit tunnel target:

          `127.0.0.1:6080`

          Configure your Playit tunnel to this local endpoint.

          Official Playit:

          https://playit.gg/

          ## 🖥️ RDP

          Username:

          `$rdpUser`

          Password:

          `RDP_PASSWORD secret`

          RDP remains protected by Windows NLA.

          ## 📸 Desktop Screenshot

          Artifact:

          `windows-2025-desktop-screenshot`

          ## ⏱️ Runtime

          **5 hours**

          "@ |
            Out-File `
              $env:GITHUB_STEP_SUMMARY `
              -Append `
              -Encoding utf8

      # ============================================================
      # 5 HOUR RUNTIME
      # ============================================================

      - name: "⏱️ Keep Windows Runner Alive - 5 Hours"
        run: |

          $ErrorActionPreference = "Continue"

          $totalSeconds =
            5 * 60 * 60

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        WINDOWS SERVER IS READY"
          Write-Host "        RUNTIME: 5 HOURS"
          Write-Host "=================================================="
          Write-Host ""

          for (
            $i = 0;
            $i -lt $totalSeconds;
            $i++
          ) {

            if (($i % 60) -eq 0) {

              $remaining =
                $totalSeconds - $i

              $hours =
                [math]::Floor(
                  $remaining / 3600
                )

              $minutes =
                [math]::Floor(
                  ($remaining % 3600) / 60
                )

              $seconds =
                $remaining % 60

              Write-Host (
                "[{0}] Remaining: {1}h {2}m {3}s" -f
                (Get-Date -Format "HH:mm:ss"),
                $hours,
                $minutes,
                $seconds
              )
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5 hour runtime completed."
