name: Windows 2025 - Tailscale Remote

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-remote:
    name: Windows Server 2025
    runs-on: windows-2025

    # Maximum requested runtime: 5 hours
    timeout-minutes: 300

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================

      - name: System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Windows Server 2025"
          Write-Host "=============================================="

          Get-ComputerInfo |
            Select-Object `
              WindowsProductName,
              WindowsVersion,
              OsArchitecture

          Write-Host ""
          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"

          $ram = Get-CimInstance Win32_ComputerSystem

          "{0:N2} GB" -f (
            $ram.TotalPhysicalMemory / 1GB
          )

          Write-Host ""

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--hostname=amiraliali3"

      # ============================================================
      # VERIFY TAILSCALE
      # ============================================================

      - name: Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (!(Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Write-Host "=============================================="
          Write-Host " Tailscale Status"
          Write-Host "=============================================="

          & $tailscale status

          Start-Sleep -Seconds 5

          # ----------------------------------------------------------
          # Get Tailscale IPv4
          # ----------------------------------------------------------

          $ip = (
            & $tailscale ip -4 |
            Select-Object -First 1
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Could not obtain Tailscale IPv4."
          }

          # ----------------------------------------------------------
          # Get JSON status
          # ----------------------------------------------------------

          $jsonText = & $tailscale status --json

          if ([string]::IsNullOrWhiteSpace($jsonText)) {
            throw "Tailscale JSON status is empty."
          }

          $status = $jsonText | ConvertFrom-Json

          # ----------------------------------------------------------
          # Get machine DNS name
          # ----------------------------------------------------------

          $dnsName = $status.Self.DNSName

          if ([string]::IsNullOrWhiteSpace($dnsName)) {

            Write-Host "DNSName was not returned."

            $dnsName = "amiraliali3"

          } else {

            $dnsName = $dnsName.TrimEnd(".")
          }

          # ----------------------------------------------------------
          # Get machine hostname
          # ----------------------------------------------------------

          $hostname = $status.Self.HostName

          if ([string]::IsNullOrWhiteSpace($hostname)) {
            $hostname = "amiraliali3"
          }

          # ----------------------------------------------------------
          # Save environment variables
          # ----------------------------------------------------------

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          "TAILSCALE_HOSTNAME=$hostname" >> $env:GITHUB_ENV
          "TAILSCALE_DOMAIN=$dnsName" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale connection successful."
          Write-Host "Machine hostname: $hostname"

          # Do NOT print IP or domain yet.
          # Screenshot must happen first.

      # ============================================================
      # FILEZILLA
      # ============================================================

      - name: Install FileZilla
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Installing FileZilla"
          Write-Host "=============================================="

          $choco = "C:\ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey is not installed."
          }

          & $choco install filezilla `
            --yes `
            --no-progress

          $exitCode = $LASTEXITCODE

          Write-Host "Chocolatey exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "FileZilla installation failed. Exit code: $exitCode"
          }

          Write-Host "FileZilla installation completed."

      # ============================================================
      # VERIFY FILEZILLA
      # ============================================================

      - name: Verify FileZilla
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "${env:ProgramFiles(x86)}\FileZilla FTP Client\filezilla.exe"
          )

          $foundPath = $null

          foreach ($path in $paths) {

            if (Test-Path $path) {
              $foundPath = $path
              break
            }
          }

          if ($null -eq $foundPath) {

            $file = Get-ChildItem `
              "$env:ProgramFiles" `
              -Filter "filezilla.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($file) {
              $foundPath = $file.FullName
            }
          }

          if ($null -eq $foundPath) {
            throw "FileZilla executable was not found."
          }

          Write-Host "FileZilla verified:"
          Write-Host $foundPath

      # ============================================================
      # NOTEPAD++
      # ============================================================

      - name: Install Notepad++
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Installing Notepad++"
          Write-Host "=============================================="

          $version = "8.9.7"

          $url = `
            "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v$version/npp.$version.Installer.x64.exe"

          $installer = Join-Path `
            $env:TEMP `
            "NotepadPlusPlus-$version-x64.exe"

          Write-Host "Downloading Notepad++..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Notepad++ installer download failed."
          }

          Write-Host "Installing Notepad++..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($process.ExitCode -ne 0) {
            throw "Notepad++ installer failed. Exit code: $($process.ExitCode)"
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Notepad++ installation completed."

      # ============================================================
      # VERIFY NOTEPAD++
      # ============================================================

      - name: Verify Notepad++
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "${env:ProgramFiles(x86)}\Notepad++\notepad++.exe"
          )

          $foundPath = $null

          foreach ($path in $paths) {

            if (Test-Path $path) {
              $foundPath = $path
              break
            }
          }

          if ($null -eq $foundPath) {
            throw "Notepad++ executable was not found."
          }

          Write-Host "Notepad++ verified:"
          Write-Host $foundPath

      # ============================================================
      # DISABLE PASSWORD COMPLEXITY
      #
      # Required because the requested password:
      #
      # aaasssaa1345
      #
      # does not contain uppercase/special characters.
      # ============================================================

      - name: Configure Local Password Policy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring local password policy..."

          $cfg = Join-Path `
            $env:TEMP `
            "local-security.cfg"

          $db = Join-Path `
            $env:TEMP `
            "local-security.sdb"

          secedit /export `
            /cfg $cfg `
            /quiet

          if (!(Test-Path $cfg)) {
            throw "Could not export local security policy."
          }

          $content = Get-Content `
            $cfg `
            -Raw

          if ($content -match "PasswordComplexity") {

            $content = $content -replace `
              "PasswordComplexity\s*=\s*\d+", `
              "PasswordComplexity = 0"

          } else {

            $content += "`r`nPasswordComplexity = 0`r`n"
          }

          Set-Content `
            -Path $cfg `
            -Value $content `
            -Encoding Unicode

          secedit /configure `
            /db $db `
            /cfg $cfg `
            /areas SECURITYPOLICY `
            /quiet

          gpupdate /force | Out-Null

          Start-Sleep -Seconds 3

          Write-Host "Local password complexity policy configured."

      # ============================================================
      # ENABLE RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Enabling Remote Desktop"
          Write-Host "=============================================="

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {
            Start-Service `
              -Name TermService
          }

          Start-Sleep -Seconds 3

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {
            throw "Remote Desktop service failed to start."
          }

          Write-Host "RDP enabled successfully."

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "amiraliali3"

          $plainPassword = "aaasssaa1345"

          Write-Host "=============================================="
          Write-Host " Creating RDP User"
          Write-Host "=============================================="

          $securePassword = ConvertTo-SecureString `
            $plainPassword `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "amiraliali3" `
              -Description "Temporary GitHub Actions RDP user" `
              -PasswordNeverExpires:$true `
              -AccountNeverExpires:$true

            Write-Host "RDP user created."

          } else {

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Write-Host "Existing RDP user password updated."
          }

          # ----------------------------------------------------------
          # Add to Remote Desktop Users
          # ----------------------------------------------------------

          $group = Get-LocalGroup `
            -Name "Remote Desktop Users" `
            -ErrorAction Stop

          $member = Get-LocalGroupMember `
            -Group $group.Name `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if ($null -eq $member) {

            Add-LocalGroupMember `
              -Group $group.Name `
              -Member $username

          }

          # ----------------------------------------------------------
          # Verify
          # ----------------------------------------------------------

          $userCheck = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $userCheck) {
            throw "RDP user was not created."
          }

          Write-Output "::add-mask::$plainPassword"

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV

          Write-Host "RDP user configured successfully."

      # ============================================================
      # RDP SERVICE VERIFICATION
      # ============================================================

      - name: Verify RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking RDP port 3389..."

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP port 3389 is listening."

      # ============================================================
      # PREPARE DESKTOP
      # ============================================================

      - name: Prepare Desktop
        shell: powershell
        run: |
          Write-Host "Preparing Windows desktop..."

          Start-Sleep -Seconds 20

      # ============================================================
      # SCREENSHOT
      #
      # IMPORTANT:
      # No Tailscale IP or domain is printed before this step.
      # ============================================================

      - name: Capture Desktop Screenshot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Capturing Desktop Screenshot"
          Write-Host "=============================================="

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screens = [System.Windows.Forms.Screen]::AllScreens

          if ($screens.Count -eq 0) {
            throw "No display detected."
          }

          $left = (
            $screens |
            ForEach-Object {
              $_.Bounds.Left
            } |
            Measure-Object -Minimum
          ).Minimum

          $top = (
            $screens |
            ForEach-Object {
              $_.Bounds.Top
            } |
            Measure-Object -Minimum
          ).Minimum

          $right = (
            $screens |
            ForEach-Object {
              $_.Bounds.Right
            } |
            Measure-Object -Maximum
          ).Maximum

          $bottom = (
            $screens |
            ForEach-Object {
              $_.Bounds.Bottom
            } |
            Measure-Object -Maximum
          ).Maximum

          $width = $right - $left
          $height = $bottom - $top

          Write-Host "Desktop:"
          Write-Host "Width:  $width"
          Write-Host "Height: $height"

          $bitmap = New-Object `
            System.Drawing.Bitmap `
            $width,
            $height

          $graphics = `
            [System.Drawing.Graphics]::FromImage($bitmap)

          try {

            $graphics.CopyFromScreen(
              $left,
              $top,
              0,
              0,
              $bitmap.Size
            )

            $screenshot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "desktop-before-ip.png"

            $bitmap.Save(
              $screenshot,
              [System.Drawing.Imaging.ImageFormat]::Png
            )

          }
          finally {

            $graphics.Dispose()
            $bitmap.Dispose()

          }

          if (!(Test-Path $screenshot)) {
            throw "Screenshot was not created."
          }

          Write-Host ""
          Write-Host "Screenshot created successfully."
          Write-Host "File: $screenshot"

      # ============================================================
      # UPLOAD SCREENSHOT
      # ============================================================

      - name: Upload Desktop Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-desktop-screenshot
          path: desktop-before-ip.png
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # CREATE GITHUB SUMMARY
      # ============================================================

      - name: Create GitHub Actions Summary
        shell: powershell
        env:
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          TAILSCALE_HOSTNAME: ${{ env.TAILSCALE_HOSTNAME }}
          TAILSCALE_DOMAIN: ${{ env.TAILSCALE_DOMAIN }}
          RUN_ID: ${{ github.run_id }}
        run: |

          $summary = @"
          # 🖥️ Windows Server 2025 Remote

          ## 🟢 Status

          | Component | Status |
          |---|---|
          | Windows Server 2025 | 🟢 Online |
          | Tailscale | 🟢 Connected |
          | FileZilla | 🟢 Installed |
          | Notepad++ | 🟢 Installed |
          | RDP | 🟢 Enabled |
          | Runtime | ⏱️ 5 Hours |

          ## 📸 Desktop Screenshot

          The screenshot was captured **before the IP and domain information was displayed**.

          **Artifact:**

          `windows-2025-desktop-screenshot`

          [📥 Open Screenshot Artifact](../../actions/runs/$env:RUN_ID)

          ## 🌐 Tailscale

          ### IPv4

          ```
          $env:TAILSCALE_IP
          ```

          ### Machine Name

          ```
          $env:TAILSCALE_HOSTNAME
          ```

          ### MagicDNS Domain

          ```
          $env:TAILSCALE_DOMAIN
          ```

          ## 🖥️ RDP

          ### Address

          ```
          $env:TAILSCALE_IP`:3389
          ```

          ### Domain

          ```
          $env:TAILSCALE_DOMAIN`:3389
          ```

          ### Username

          ```
          amiraliali3
          ```

          ### Password

          ```
          aaasssaa1345
          ```

          ## ⏱️ Runtime

          The Windows runner will remain online for approximately **5 hours**.

          ## ⚠️ Important

          This is a temporary GitHub-hosted Windows Server 2025 runner.

          When the workflow ends, GitHub destroys the virtual machine.

          "@

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8

      # ============================================================
      # SHOW IP + DOMAIN
      #
      # THIS IS INTENTIONALLY AFTER SCREENSHOT.
      # ============================================================

      - name: Show Remote Connection Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "       WINDOWS SERVER 2025 REMOTE ACCESS"
          Write-Host "======================================================"
          Write-Host ""

          Write-Host "Username:"
          Write-Host "amiraliali3"

          Write-Host ""

          Write-Host "Password:"
          Write-Host "aaasssaa1345"

          Write-Host ""

          Write-Host "Tailscale IPv4:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""

          Write-Host "Tailscale Hostname:"
          Write-Host $env:TAILSCALE_HOSTNAME

          Write-Host ""

          Write-Host "Tailscale MagicDNS:"
          Write-Host $env:TAILSCALE_DOMAIN

          Write-Host ""

          Write-Host "RDP IP:"
          Write-Host "$($env:TAILSCALE_IP):3389"

          Write-Host ""

          Write-Host "RDP Domain:"
          Write-Host "$($env:TAILSCALE_DOMAIN):3389"

          Write-Host ""

          Write-Host "======================================================"

      # ============================================================
      # KEEP SERVER ONLINE FOR 5 HOURS
      # ============================================================

      - name: Keep Server Online For 5 Hours
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $totalSeconds = 5 * 60 * 60

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " Windows Server 2025 is ONLINE"
          Write-Host " Runtime: 5 Hours"
          Write-Host "=============================================="
          Write-Host ""

          for ($i = 0; $i -lt $totalSeconds; $i++) {

            if (($i % 60) -eq 0) {

              $remaining = $totalSeconds - $i

              $hours = [math]::Floor(
                $remaining / 3600
              )

              $minutes = [math]::Floor(
                ($remaining % 3600) / 60
              )

              Write-Host `
                "Remaining: ${hours}h ${minutes}m"
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5-hour runtime completed."

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup Tailscale
        if: always()
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host " Cleaning up Tailscale"
          Write-Host "=============================================="

          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (Test-Path $tailscale) {

            try {

              & $tailscale logout

              Write-Host "Tailscale logout completed."

            }
            catch {

              Write-Host "Tailscale cleanup completed."

            }

          } else {

            Write-Host "Tailscale executable not found during cleanup."

          }
