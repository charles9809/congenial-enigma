name: Windows 2025 - Secure Tailscale RDP

on:
  workflow_dispatch:
    inputs:
      loops:
        description: "🔄 Number of chained runs"
        required: false
        default: "1"
        type: string

concurrency:
  group: windows-tailscale-rdp
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  secure-rdp:

    name: Windows Server 2025 - Tailscale RDP

    runs-on: windows-2025

    # GitHub-hosted runner maximum is platform-dependent.
    # 300 minutes = 5 hours.
    timeout-minutes: 300

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================

      - name: 🖥️ System Information
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        WINDOWS SERVER 2025"
          Write-Host "=================================================="

          $os = Get-ComputerInfo

          Write-Host ""
          Write-Host "OS:"
          Write-Host $os.WindowsProductName

          Write-Host ""
          Write-Host "Version:"
          Write-Host $os.WindowsVersion

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host $os.OsArchitecture

          Write-Host ""
          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"

          $ram = Get-CimInstance Win32_ComputerSystem

          "{0:N2} GB" -f (
            $ram.TotalPhysicalMemory / 1GB
          )

          Write-Host ""
          Write-Host "=================================================="

      # ============================================================
      # 2. CONNECT TAILSCALE
      # ============================================================

      - name: 🌐 Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: "--hostname=amiraliali3-${{ github.run_number }}"

      # ============================================================
      # 3. VERIFY TAILSCALE
      # ============================================================

      - name: 🌐 Verify Tailscale
        run: |

          $ErrorActionPreference = "Stop"

          $tailscale = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {

              $tailscale = `
                "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (!(Test-Path $tailscale)) {

              throw "Tailscale executable not found."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "        TAILSCALE CONNECTION"
          Write-Host "=================================================="

          Start-Sleep -Seconds 5

          & $tailscale status

          Write-Host ""

          $ip = (
              & $tailscale ip -4 |
              Select-Object -First 1
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {

              throw "Tailscale IPv4 was not detected."
          }

          $statusRaw = & $tailscale status --json

          if ([string]::IsNullOrWhiteSpace($statusRaw)) {

              throw "Tailscale JSON status unavailable."
          }

          $status = $statusRaw | ConvertFrom-Json

          $hostname = $status.Self.HostName

          $dnsName = $status.Self.DNSName

          if ([string]::IsNullOrWhiteSpace($hostname)) {

              $hostname = "amiraliali3-${{ github.run_number }}"
          }

          if ([string]::IsNullOrWhiteSpace($dnsName)) {

              $dnsName = $hostname

          } else {

              $dnsName = $dnsName.TrimEnd(".")
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          "TAILSCALE_HOSTNAME=$hostname" >> $env:GITHUB_ENV

          "TAILSCALE_DOMAIN=$dnsName" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale connected."
          Write-Host "Hostname detected: $hostname"

          # Deliberately don't expose IP yet.
          # Screenshot comes first.

      # ============================================================
      # 4. INSTALL FILEZILLA
      # ============================================================

      - name: 📁 Install FileZilla
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Installing FileZilla..."

          $choco = `
            "C:\ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {

              throw "Chocolatey was not found."
          }

          & $choco install filezilla `
            --yes `
            --no-progress

          if ($LASTEXITCODE -ne 0) {

              throw "FileZilla installation failed."
          }

          Write-Host "FileZilla installed successfully."

      # ============================================================
      # 5. VERIFY FILEZILLA
      # ============================================================

      - name: 📁 Verify FileZilla
        run: |

          $paths = @(

            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",

            "${env:ProgramFiles(x86)}\FileZilla FTP Client\filezilla.exe"

          )

          $found = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {

                  $found = $path
                  break
              }
          }

          if (!$found) {

              $found = Get-ChildItem `
                "$env:ProgramFiles" `
                -Filter "filezilla.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1 |
                Select-Object -ExpandProperty FullName
          }

          if (!$found) {

              throw "FileZilla executable was not found."
          }

          Write-Host "FileZilla:"
          Write-Host $found

      # ============================================================
      # 6. INSTALL NOTEPAD++
      # ============================================================

      - name: 📝 Install Notepad++
        run: |

          $ErrorActionPreference = "Stop"

          $version = "8.9.7"

          $url = `
            "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v$version/npp.$version.Installer.x64.exe"

          $installer = Join-Path `
            $env:TEMP `
            "npp-installer.exe"

          Write-Host ""
          Write-Host "Downloading Notepad++..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {

              throw "Notepad++ download failed."
          }

          Write-Host "Installing Notepad++..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($process.ExitCode -ne 0) {

              throw "Notepad++ installation failed."
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Notepad++ installed."

      # ============================================================
      # 7. VERIFY NOTEPAD++
      # ============================================================

      - name: 📝 Verify Notepad++
        run: |

          $paths = @(

            "$env:ProgramFiles\Notepad++\notepad++.exe",

            "${env:ProgramFiles(x86)}\Notepad++\notepad++.exe"

          )

          $found = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {

                  $found = $path
                  break
              }
          }

          if (!$found) {

              throw "Notepad++ executable was not found."
          }

          Write-Host "Notepad++:"
          Write-Host $found

      # ============================================================
      # 8. ENABLE RDP
      # ============================================================

      - name: 🖥️ Enable Remote Desktop
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {

              Start-Service `
                -Name "TermService"
          }

          Start-Sleep -Seconds 3

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {

              throw "TermService failed to start."
          }

          Write-Host "RDP enabled."

      # ============================================================
      # 9. CREATE RDP USER
      # ============================================================

      - name: 👤 Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          $username = "amiraliali3"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {

              throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName "amiraliali3" `
                -Description "Temporary RDP user" `
                -PasswordNeverExpires:$true `
                -AccountNeverExpires:$true

              Write-Host "User created."

          } else {

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Write-Host "Existing user password updated."
          }

          # ----------------------------------------------------------
          # Remote Desktop Users
          # ----------------------------------------------------------

          $member = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\amiraliali3$"
            }

          if ($null -eq $member) {

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $username
          }

          # ----------------------------------------------------------
          # Save username only
          # ----------------------------------------------------------

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV

          Write-Host "RDP user configured."

      # ============================================================
      # 10. VERIFY RDP PORT
      # ============================================================

      - name: 🔍 Verify RDP
        run: |

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {

              throw "RDP TCP 3389 is not listening."
          }

          Write-Host "RDP TCP 3389 is listening."

      # ============================================================
      # 11. WAIT FOR DESKTOP
      # ============================================================

      - name: 🖥️ Prepare Desktop
        run: |

          Write-Host "Preparing desktop..."

          Start-Sleep -Seconds 20

      # ============================================================
      # 12. SCREENSHOT
      #
      # This happens BEFORE exposing Tailscale IP/domain.
      # ============================================================

      - name: 📸 Capture Desktop
        run: |

          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Windows.Forms

          Add-Type -AssemblyName System.Drawing

          $screens = `
            [System.Windows.Forms.Screen]::AllScreens

          if ($screens.Count -eq 0) {

              throw "No display detected."
          }

          $left = (
            $screens |
            ForEach-Object {
              $_.Bounds.Left
            } |
            Measure-Object -Minimum
          ).Minimum

          $top = (
            $screens |
            ForEach-Object {
              $_.Bounds.Top
            } |
            Measure-Object -Minimum
          ).Minimum

          $right = (
            $screens |
            ForEach-Object {
              $_.Bounds.Right
            } |
            Measure-Object -Maximum
          ).Maximum

          $bottom = (
            $screens |
            ForEach-Object {
              $_.Bounds.Bottom
            } |
            Measure-Object -Maximum
          ).Maximum

          $width = $right - $left

          $height = $bottom - $top

          $file = Join-Path `
            $env:GITHUB_WORKSPACE `
            "desktop-screenshot.png"

          $bitmap = New-Object `
            System.Drawing.Bitmap `
            $width,
            $height

          $graphics = `
            [System.Drawing.Graphics]::FromImage($bitmap)

          try {

              $graphics.CopyFromScreen(
                $left,
                $top,
                0,
                0,
                $bitmap.Size
              )

              $bitmap.Save(
                $file,
                [System.Drawing.Imaging.ImageFormat]::Png
              )

          }
          finally {

              $graphics.Dispose()

              $bitmap.Dispose()
          }

          if (!(Test-Path $file)) {

              throw "Screenshot was not created."
          }

          Write-Host "Screenshot created:"
          Write-Host $file

      # ============================================================
      # 13. UPLOAD SCREENSHOT
      # ============================================================

      - name: 📦 Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-desktop
          path: desktop-screenshot.png
          if-no-files-found: error
          retention-days: 1

      # ============================================================
      # 14. CREATE SUMMARY
      # ============================================================

      - name: 📋 GitHub Actions Summary
        run: |

          $summary = @"

          # 🖥️ Windows Server 2025

          ## 🟢 Server Status

          | Component | Status |
          |---|---|
          | Windows Server 2025 | 🟢 Online |
          | Tailscale | 🟢 Connected |
          | Remote Desktop | 🟢 Enabled |
          | FileZilla | 🟢 Installed |
          | Notepad++ | 🟢 Installed |
          | Runner | 🟢 Active |

          ---

          ## 📸 Desktop Screenshot

          Screenshot was captured **before the connection information was displayed**.

          Screenshot artifact:

          **windows-2025-desktop**

          ---

          ## 🌐 Tailscale

          ### IPv4

          ``````
          $env:TAILSCALE_IP
          ``````

          ### Hostname

          ``````
          $env:TAILSCALE_HOSTNAME
          ``````

          ### MagicDNS

          ``````
          $env:TAILSCALE_DOMAIN
          ``````

          ---

          ## 🖥️ RDP

          ### IP

          ``````
          $env:TAILSCALE_IP`:3389
          ``````

          ### Domain

          ``````
          $env:TAILSCALE_DOMAIN`:3389
          ``````

          ### Username

          ``````
          amiraliali3
          ``````

          > 🔐 The RDP password is stored as a GitHub Actions Secret and is intentionally not written to the Summary.

          ---

          ## ⏱️ Runtime

          This runner is configured for a maximum runtime of **5 hours**.

          ---

          ⚠️ **Important:** GitHub-hosted runners are temporary machines and are destroyed after the workflow ends.

          "@

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8

      # ============================================================
      # 15. CONNECTION INFORMATION
      #
      # Screenshot has already been taken.
      # ============================================================

      - name: 🔗 Show Connection Information
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "              WINDOWS 2025 REMOTE ACCESS"
          Write-Host "=========================================================="

          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "RDP Domain:"
          Write-Host "$env:TAILSCALE_DOMAIN`:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "amiraliali3"

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "Tailscale Hostname:"
          Write-Host $env:TAILSCALE_HOSTNAME

          Write-Host ""
          Write-Host "=========================================================="

      # ============================================================
      # 16. KEEP RUNNER ALIVE
      # ============================================================

      - name: ⏱️ Keep Runner Online
        run: |

          $totalSeconds = 5 * 60 * 60

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "       REMOTE WINDOWS SERVER IS ONLINE"
          Write-Host "       RUNTIME: 5 HOURS"
          Write-Host "=================================================="

          for ($i = 0; $i -lt $totalSeconds; $i++) {

              if (($i % 60) -eq 0) {

                  $remaining = $totalSeconds - $i

                  $hours = [math]::Floor(
                    $remaining / 3600
                  )

                  $minutes = [math]::Floor(
                    ($remaining % 3600) / 60
                  )

                  Write-Host `
                    "[$(Get-Date -Format 'HH:mm:ss')] Remaining: ${hours}h ${minutes}m"
              }

              Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5-hour runtime completed."

      # ============================================================
      # 17. CLEANUP
      # ============================================================

      - name: 🧹 Cleanup
        if: always()
        run: |

          Write-Host ""
          Write-Host "Cleaning up Tailscale..."

          $tailscale = `
            "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {

              $tailscale = `
                "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (Test-Path $tailscale) {

              try {

                  & $tailscale logout

                  Write-Host "Tailscale disconnected."

              }
              catch {

                  Write-Host "Tailscale cleanup completed."
              }
          }

          Write-Host "Cleanup finished."
