name: Windows 2025 - Secure Tailscale RDP

on:
  workflow_dispatch:

concurrency:
  group: windows-2025-tailscale-rdp
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:

  secure-rdp:

    name: Windows Server 2025 - Tailscale RDP

    runs-on: windows-2025

    # 5 hours
    timeout-minutes: 300

    steps:

      # ==========================================================
      # 1. SYSTEM INFORMATION
      # ==========================================================

      - name: "🖥️ System Information"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "             WINDOWS SERVER 2025"
          Write-Host "======================================================"

          $os = Get-ComputerInfo

          Write-Host "OS:"
          Write-Host $os.WindowsProductName

          Write-Host ""
          Write-Host "Version:"
          Write-Host $os.WindowsVersion

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host $os.OsArchitecture

          Write-Host ""
          Write-Host "CPU:"

          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "RAM:"

          $ram = Get-CimInstance Win32_ComputerSystem

          Write-Host (
            "{0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB)
          )

          Write-Host ""
          Write-Host "======================================================"

      # ==========================================================
      # 2. CONNECT TAILSCALE
      #
      # IMPORTANT:
      # DO NOT PASS --hostname HERE.
      # The previous error was caused by hostname being supplied twice.
      # ==========================================================

      - name: "🌐 Connect to Tailscale"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          log-mode: normal

      # ==========================================================
      # 3. CONFIGURE TAILSCALE
      # ==========================================================

      - name: "🌐 Configure Tailscale"
        run: |

          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            $tailscale = "$env:ProgramFiles(x86)\Tailscale\tailscale.exe"
          }

          if (!(Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          # Unique node name for this GitHub runner.
          $hostname = "amiraliali3-${{ github.run_number }}"

          Write-Host ""
          Write-Host "Setting Tailscale hostname:"
          Write-Host $hostname

          & $tailscale set "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "tailscale set --hostname failed."
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscale status

          # --------------------------------------------------------
          # Wait until IPv4 is available
          # --------------------------------------------------------

          $ip = $null

          for ($attempt = 1; $attempt -le 30; $attempt++) {

            $ip = (
              & $tailscale ip -4 2>$null |
              Select-Object -First 1
            ).Trim()

            if (-not [string]::IsNullOrWhiteSpace($ip)) {
              break
            }

            Write-Host "Waiting for Tailscale IPv4... attempt $attempt/30"

            Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IPv4 was not available after 60 seconds."
          }

          # --------------------------------------------------------
          # Get DNS name from Tailscale
          # --------------------------------------------------------

          $dnsName = $null

          try {

            $json = & $tailscale status --json 2>$null

            if (-not [string]::IsNullOrWhiteSpace($json)) {

              $status = $json | ConvertFrom-Json

              $dnsName = $status.Self.DNSName
            }

          } catch {

            Write-Host "Unable to read DNSName from JSON status."
          }

          if ([string]::IsNullOrWhiteSpace($dnsName)) {

            $dnsName = $hostname

          } else {

            $dnsName = $dnsName.TrimEnd(".")
          }

          # Save values for later steps.
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          "TAILSCALE_HOSTNAME=$hostname" >> $env:GITHUB_ENV
          "TAILSCALE_DOMAIN=$dnsName" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale successfully connected."
          Write-Host "Hostname detected: $hostname"

          # Do NOT print IP or domain here.
          # Screenshot must happen first.

      # ==========================================================
      # 4. INSTALL FILEZILLA
      # ==========================================================

      - name: "📁 Install FileZilla"
        run: |

          $ErrorActionPreference = "Stop"

          $choco = "$env:ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey was not found on windows-2025."
          }

          Write-Host "Installing FileZilla..."

          & $choco install filezilla `
            --yes `
            --no-progress

          $exitCode = $LASTEXITCODE

          Write-Host "Chocolatey exit code: $exitCode"

          # Chocolatey package installation normally returns 0
          # for success. Fail immediately otherwise.

          if ($exitCode -ne 0) {
            throw "FileZilla installation failed. Exit code: $exitCode"
          }

          Write-Host "FileZilla installation completed."

      # ==========================================================
      # 5. VERIFY FILEZILLA
      # ==========================================================

      - name: "📁 Verify FileZilla"
        run: |

          $ErrorActionPreference = "Stop"

          $possiblePaths = @(
            "$env:ProgramFiles\FileZilla FTP Client\filezilla.exe",
            "$env:ProgramFiles(x86)\FileZilla FTP Client\filezilla.exe"
          )

          $filezilla = $null

          foreach ($path in $possiblePaths) {

            if (Test-Path $path) {
              $filezilla = $path
              break
            }
          }

          if ($null -eq $filezilla) {

            $filezilla = Get-ChildItem `
              "$env:ProgramFiles" `
              -Filter "filezilla.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              Select-Object -ExpandProperty FullName
          }

          if ([string]::IsNullOrWhiteSpace($filezilla)) {
            throw "FileZilla executable was not found after installation."
          }

          Write-Host "FileZilla verified:"
          Write-Host $filezilla

      # ==========================================================
      # 6. INSTALL NOTEPAD++
      # ==========================================================

      - name: "📝 Install Notepad++"
        run: |

          $ErrorActionPreference = "Stop"

          $choco = "$env:ProgramData\chocolatey\bin\choco.exe"

          if (!(Test-Path $choco)) {
            throw "Chocolatey was not found."
          }

          Write-Host "Installing Notepad++..."

          # Current Chocolatey package verified in July 2026.
          & $choco install notepadplusplus.install `
            --yes `
            --no-progress

          $exitCode = $LASTEXITCODE

          Write-Host "Chocolatey exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "Notepad++ installation failed. Exit code: $exitCode"
          }

          Write-Host "Notepad++ installation completed."

      # ==========================================================
      # 7. VERIFY NOTEPAD++
      # ==========================================================

      - name: "📝 Verify Notepad++"
        run: |

          $ErrorActionPreference = "Stop"

          $possiblePaths = @(
            "$env:ProgramFiles\Notepad++\notepad++.exe",
            "$env:ProgramFiles(x86)\Notepad++\notepad++.exe"
          )

          $notepad = $null

          foreach ($path in $possiblePaths) {

            if (Test-Path $path) {
              $notepad = $path
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($notepad)) {
            throw "Notepad++ executable was not found."
          }

          Write-Host "Notepad++ verified:"
          Write-Host $notepad

      # ==========================================================
      # 8. CONFIGURE LOCAL PASSWORD POLICY
      #
      # The requested password can otherwise be rejected by the
      # Windows complexity policy.
      # ==========================================================

      - name: "🔐 Configure Local Password Policy"
        run: |

          $ErrorActionPreference = "Stop"

          $cfg = Join-Path `
            $env:TEMP `
            "local-security.inf"

          $db = Join-Path `
            $env:TEMP `
            "local-security.sdb"

          Write-Host "Exporting local security policy..."

          secedit /export `
            /cfg "$cfg" `
            /quiet

          if (!(Test-Path $cfg)) {
            throw "Failed to export local security policy."
          }

          $content = Get-Content `
            "$cfg" `
            -Raw

          if ($content -match 'PasswordComplexity\s*=') {

            $content = [regex]::Replace(
              $content,
              'PasswordComplexity\s*=\s*\d+',
              'PasswordComplexity = 0'
            )

          } else {

            $content += "`r`nPasswordComplexity = 0`r`n"
          }

          Set-Content `
            -Path "$cfg" `
            -Value $content `
            -Encoding Unicode

          secedit /configure `
            /db "$db" `
            /cfg "$cfg" `
            /areas SECURITYPOLICY `
            /quiet

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to apply local password policy."
          }

          gpupdate /force | Out-Null

          Start-Sleep -Seconds 3

          Write-Host "Password complexity policy configured."

      # ==========================================================
      # 9. ENABLE RDP
      # ==========================================================

      - name: "🖥️ Enable Remote Desktop"
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          # Enable RDP.
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Enable Windows built-in RDP firewall rules.
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # Ensure service is automatic and running.
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {
            Start-Service `
              -Name "TermService"
          }

          Start-Sleep -Seconds 3

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {
            throw "Remote Desktop Service failed to start."
          }

          Write-Host "Remote Desktop enabled."

      # ==========================================================
      # 10. CREATE RDP USER
      # ==========================================================

      - name: "👤 Create RDP User"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          $username = "amiraliali3"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          # Prevent accidental log exposure.
          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            Write-Host "Creating RDP user..."

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "amiraliali3" `
              -Description "Temporary GitHub Actions RDP User" `
              -PasswordNeverExpires:$true `
              -AccountNeverExpires:$true

          } else {

            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }

          # Add user to Remote Desktop Users.
          $member = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\amiraliali3$"
            }

          if ($null -eq $member) {

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $username
          }

          # Never add the user to Administrators.
          # RDP does not require local administrator membership.

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV

          Write-Host "RDP user configured successfully."

      # ==========================================================
      # 11. VERIFY RDP PORT
      # ==========================================================

      - name: "🔍 Verify RDP TCP 3389"
        run: |

          $ErrorActionPreference = "Stop"

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            throw "RDP is not listening on TCP 3389."
          }

          Write-Host "RDP TCP 3389 is listening."

      # ==========================================================
      # 12. WAIT FOR DESKTOP
      # ==========================================================

      - name: "🖥️ Prepare Desktop"
        run: |

          Write-Host "Preparing desktop..."

          Start-Sleep -Seconds 20

      # ==========================================================
      # 13. CAPTURE SCREENSHOT
      #
      # IMPORTANT:
      # Tailscale IP / DNS are NOT printed until after this step.
      # ==========================================================

      - name: "📸 Capture Desktop Screenshot"
        run: |

          $ErrorActionPreference = "Stop"

          Add-Type `
            -AssemblyName System.Windows.Forms

          Add-Type `
            -AssemblyName System.Drawing

          $screens = `
            [System.Windows.Forms.Screen]::AllScreens

          if ($null -eq $screens -or $screens.Count -eq 0) {
            throw "No display was detected."
          }

          $left = (
            $screens |
            ForEach-Object {
              $_.Bounds.Left
            } |
            Measure-Object -Minimum
          ).Minimum

          $top = (
            $screens |
            ForEach-Object {
              $_.Bounds.Top
            } |
            Measure-Object -Minimum
          ).Minimum

          $right = (
            $screens |
            ForEach-Object {
              $_.Bounds.Right
            } |
            Measure-Object -Maximum
          ).Maximum

          $bottom = (
            $screens |
            ForEach-Object {
              $_.Bounds.Bottom
            } |
            Measure-Object -Maximum
          ).Maximum

          $width = $right - $left
          $height = $bottom - $top

          Write-Host "Desktop size: ${width}x${height}"

          $file = Join-Path `
            $env:GITHUB_WORKSPACE `
            "desktop-screenshot.png"

          $bitmap = New-Object `
            System.Drawing.Bitmap `
            $width,
            $height

          $graphics = `
            [System.Drawing.Graphics]::FromImage($bitmap)

          try {

            $graphics.CopyFromScreen(
              $left,
              $top,
              0,
              0,
              $bitmap.Size
            )

            $bitmap.Save(
              $file,
              [System.Drawing.Imaging.ImageFormat]::Png
            )

          }
          finally {

            $graphics.Dispose()

            $bitmap.Dispose()
          }

          if (!(Test-Path $file)) {
            throw "Desktop screenshot was not created."
          }

          Write-Host "Screenshot created successfully."

      # ==========================================================
      # 14. UPLOAD SCREENSHOT
      # ==========================================================

      - name: "📦 Upload Desktop Screenshot"
        uses: actions/upload-artifact@v4
        with:
          name: windows-2025-desktop-screenshot
          path: desktop-screenshot.png
          if-no-files-found: error
          retention-days: 1

      # ==========================================================
      # 15. CREATE GITHUB SUMMARY
      # ==========================================================

      - name: "📋 Create GitHub Summary"
        env:
          TS_IP: ${{ env.TAILSCALE_IP }}
          TS_HOSTNAME: ${{ env.TAILSCALE_HOSTNAME }}
          TS_DOMAIN: ${{ env.TAILSCALE_DOMAIN }}
        run: |

          $artifactUrl = `
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $summary = @"
          # 🖥️ Windows Server 2025

          ## 🟢 Status

          | Component | Status |
          |---|---|
          | Windows Server 2025 | 🟢 Online |
          | Tailscale | 🟢 Connected |
          | RDP | 🟢 Enabled |
          | FileZilla | 🟢 Installed |
          | Notepad++ | 🟢 Installed |
          | Screenshot | 🟢 Captured |

          ---

          ## 📸 Desktop Screenshot

          The screenshot was captured **before the IP and DNS information was exposed**.

          **[📥 Open workflow artifacts]($artifactUrl)**

          Artifact:

          `windows-2025-desktop-screenshot`

          ---

          ## 🌐 Tailscale

          **IPv4**

          ```
          $env:TS_IP
          ```

          **Machine Name**

          ```
          $env:TS_HOSTNAME
          ```

          **MagicDNS**

          ```
          $env:TS_DOMAIN
          ```

          ---

          ## 🖥️ Remote Desktop

          **RDP IP**

          ```
          $env:TS_IP:3389
          ```

          **RDP Domain**

          ```
          $env:TS_DOMAIN:3389
          ```

          **Username**

          ```
          amiraliali3
          ```

          **Password**

          The password is stored in the `RDP_PASSWORD` GitHub Secret and is not written into this Summary.

          ---

          ## ⏱️ Runtime

          This workflow keeps the runner alive for approximately **5 hours**.

          > GitHub-hosted runners are temporary and are destroyed when the workflow ends.

          "@

          $summary |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8

      # ==========================================================
      # 16. SHOW CONNECTION INFORMATION
      #
      # This is intentionally AFTER screenshot.
      # ==========================================================

      - name: "🔗 Show Connection Information"
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "              WINDOWS 2025 REMOTE ACCESS"
          Write-Host "=========================================================="

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Tailscale Hostname:"
          Write-Host $env:TAILSCALE_HOSTNAME

          Write-Host ""
          Write-Host "MagicDNS:"
          Write-Host $env:TAILSCALE_DOMAIN

          Write-Host ""
          Write-Host "RDP IP:"
          Write-Host "$($env:TAILSCALE_IP):3389"

          Write-Host ""
          Write-Host "RDP Domain:"
          Write-Host "$($env:TAILSCALE_DOMAIN):3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "amiraliali3"

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "=========================================================="

      # ==========================================================
      # 17. KEEP RUNNER ALIVE
      # ==========================================================

      - name: "⏱️ Keep Runner Online For 5 Hours"
        run: |

          $totalSeconds = 5 * 60 * 60

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "       WINDOWS SERVER 2025 IS ONLINE"
          Write-Host "       RUNTIME: 5 HOURS"
          Write-Host "======================================================"
          Write-Host ""

          for ($i = 0; $i -lt $totalSeconds; $i++) {

            if (($i % 60) -eq 0) {

              $remaining = $totalSeconds - $i

              $hours = [math]::Floor(
                $remaining / 3600
              )

              $minutes = [math]::Floor(
                ($remaining % 3600) / 60
              )

              Write-Host `
                "[$(Get-Date -Format 'HH:mm:ss')] Remaining: ${hours}h ${minutes}m"
            }

            Start-Sleep -Seconds 1
          }

          Write-Host ""
          Write-Host "5-hour runtime completed."

      # ==========================================================
      # 18. CLEANUP
      # ==========================================================

      - name: "🧹 Cleanup Tailscale"
        if: always()
        run: |

          Write-Host ""
          Write-Host "Cleaning up Tailscale..."

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            $tailscale = "$env:ProgramFiles(x86)\Tailscale\tailscale.exe"
          }

          if (Test-Path $tailscale) {

            try {

              & $tailscale logout

              Write-Host "Tailscale disconnected."

            }
            catch {

              Write-Host "Tailscale cleanup completed."
            }

          } else {

            Write-Host "Tailscale executable not found."
          }

          Write-Host "Cleanup completed."
