name: Avica Remote Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avica-remote:
    name: Windows Avica Remote
    runs-on: windows-latest
    timeout-minutes: 320

    defaults:
      run:
        shell: pwsh

    steps:

      # =========================================================
      # 1. Configure Windows RDP
      # =========================================================
      - name: Configure Windows RDP
        run: |
          Write-Host "Configuring Windows Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Avica" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Avica" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Set-Service -Name TermService -StartupType Automatic

          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."

      # =========================================================
      # 2. Create RDP User
      # =========================================================
      - name: Create RDP User
        run: |
          Write-Host "Creating RDP user..."

          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $numbers = [char[]](48..57)
          $special = [char[]](33..47)

          $passwordChars = @()

          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join (
              $passwordChars |
              Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Removing existing RDP user..."
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP"

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"

          $verify = Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if (!$verify) {
              throw "Failed to create RDP user."
          }

          Write-Host "RDP user created successfully."

          # Store only for this workflow.
          "RDP_USERNAME=RDP" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          "RDP_PASSWORD=$password" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # =========================================================
      # 3. Download Avica
      # =========================================================
      - name: Download Avica
        run: |
          $avicaUrl = "https://download.avica.com/downloader/Avica_setup.exe"
          $installer = "$env:TEMP\Avica_setup.exe"

          Write-Host "Downloading Avica..."
          Write-Host $avicaUrl

          Invoke-WebRequest `
              -Uri $avicaUrl `
              -OutFile $installer `
              -UseBasicParsing

          if (!(Test-Path $installer)) {
              throw "Avica installer was not downloaded."
          }

          $fileInfo = Get-Item $installer

          Write-Host "Installer:"
          Write-Host $fileInfo.FullName
          Write-Host "Size: $($fileInfo.Length) bytes"

          if ($fileInfo.Length -lt 100000) {
              throw "Avica installer appears to be invalid or incomplete."
          }

          "AVICA_INSTALLER=$installer" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # =========================================================
      # 4. Install Avica
      # =========================================================
      - name: Install Avica
        run: |
          Write-Host "Installing Avica..."

          $installer = $env:AVICA_INSTALLER

          # Try silent installation first.
          $process = Start-Process `
              -FilePath $installer `
              -ArgumentList "/S" `
              -Wait `
              -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          Start-Sleep -Seconds 10

          Write-Host "Searching for Avica.exe..."

          $searchPaths = @(
              "$env:ProgramFiles\Avica",
              "${env:ProgramFiles(x86)}\Avica",
              "$env:LOCALAPPDATA\Avica",
              "$env:ProgramFiles\Avica Remote Desktop",
              "${env:ProgramFiles(x86)}\Avica Remote Desktop",
              "$env:LOCALAPPDATA\Programs\Avica"
          )

          $avicaExe = $null

          foreach ($basePath in $searchPaths) {

              if (Test-Path $basePath) {

                  Write-Host "Searching: $basePath"

                  $result = Get-ChildItem `
                      -Path $basePath `
                      -Filter "Avica.exe" `
                      -Recurse `
                      -File `
                      -ErrorAction SilentlyContinue |
                      Select-Object -First 1

                  if ($result) {
                      $avicaExe = $result.FullName
                      break
                  }
              }
          }

          # Fallback: search common locations.
          if (!$avicaExe) {

              Write-Host "Avica.exe was not found in common paths."
              Write-Host "Running broader search..."

              $result = Get-ChildItem `
                  -Path "$env:ProgramFiles",
                        "${env:ProgramFiles(x86)}",
                        "$env:LOCALAPPDATA" `
                  -Filter "Avica.exe" `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

              if ($result) {
                  $avicaExe = $result.FullName
              }
          }

          if (!$avicaExe) {
              throw "Avica.exe was not found after installation."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Avica executable found:"
          Write-Host $avicaExe
          Write-Host "=========================================="
          Write-Host ""

          "AVICA_EXE=$avicaExe" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # =========================================================
      # 5. Start Avica
      # =========================================================
      - name: Start Avica
        run: |
          Write-Host "Starting Avica..."

          $avica = Start-Process `
              -FilePath "$env:AVICA_EXE" `
              -PassThru

          Start-Sleep -Seconds 15

          $process = Get-Process `
              -Name "Avica" `
              -ErrorAction SilentlyContinue

          if ($process) {
              Write-Host "Avica process is running."
          }
          else {
              Write-Warning "Avica process was not detected."
          }

          Write-Host "Waiting for Avica GUI..."
          Start-Sleep -Seconds 20

      # =========================================================
      # 6. Make sure Avica is foreground / visible
      # =========================================================
      - name: Prepare Avica Window
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(
                  IntPtr hWnd,
                  int nCmdShow
              );

              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(
                  IntPtr hWnd
              );
          }
          "@

          $process = Get-Process `
              -Name "Avica" `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.MainWindowHandle -ne 0
              } |
              Select-Object -First 1

          if ($process) {

              Write-Host "Avica window found."

              [Win32]::ShowWindow(
                  $process.MainWindowHandle,
                  5
              )

              [Win32]::SetForegroundWindow(
                  $process.MainWindowHandle
              )

              Start-Sleep -Seconds 5

          }
          else {

              Write-Warning "Avica main window was not found."
              Write-Warning "The screenshot will still be captured."
          }

      # =========================================================
      # 7. Take Full Desktop Screenshot
      # =========================================================
      - name: Capture Avica Screenshot
        run: |

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          Write-Host "Detecting display..."

          $screens = [System.Windows.Forms.Screen]::AllScreens

          if ($screens.Count -eq 0) {
              throw "No display was detected."
          }

          Write-Host "Displays detected: $($screens.Count)"

          # Use primary display.
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen

          $bounds = $screen.Bounds

          Write-Host "Screen:"
          Write-Host "X      : $($bounds.X)"
          Write-Host "Y      : $($bounds.Y)"
          Write-Host "Width  : $($bounds.Width)"
          Write-Host "Height : $($bounds.Height)"

          $bitmap = New-Object `
              System.Drawing.Bitmap `
              $bounds.Width,
              $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
              $bounds.X,
              $bounds.Y,
              0,
              0,
              $bounds.Size,
              [System.Drawing.CopyPixelOperation]::SourceCopy
          )

          $screenshot = Join-Path `
              $env:GITHUB_WORKSPACE `
              "avica-screen.png"

          $bitmap.Save(
              $screenshot,
              [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          if (!(Test-Path $screenshot)) {
              throw "Screenshot was not created."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Screenshot created:"
          Write-Host $screenshot
          Write-Host "=========================================="
          Write-Host ""

      # =========================================================
      # 8. Upload Screenshot
      # =========================================================
      - name: Upload Avica Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: AVICA-CONNECTION-SCREEN
          path: avica-screen.png
          if-no-files-found: error
          retention-days: 1

      # =========================================================
      # 9. Show connection information
      # =========================================================
      - name: Show Session Information
        run: |
          Write-Host ""
          Write-Host "===================================================="
          Write-Host "              AVICA WINDOWS SESSION"
          Write-Host "===================================================="
          Write-Host ""
          Write-Host "Avica has been installed and started."
          Write-Host ""
          Write-Host "The screenshot is available as:"
          Write-Host "AVICA-CONNECTION-SCREEN"
          Write-Host ""
          Write-Host "Open the Artifact and inspect the Avica window."
          Write-Host ""
          Write-Host "RDP Username: $env:RDP_USERNAME"
          Write-Host "RDP Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "===================================================="

      # =========================================================
      # 10. Keep Runner Alive
      # =========================================================
      - name: Keep Avica Running
        run: |

          Write-Host ""
          Write-Host "Avica session is active."
          Write-Host "Runner will remain alive."
          Write-Host ""

          while ($true) {

              $avicaProcess = Get-Process `
                  -Name "Avica" `
                  -ErrorAction SilentlyContinue

              if ($avicaProcess) {

                  Write-Host `
                      "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Avica is running."

              }
              else {

                  Write-Warning `
                      "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Avica process is NOT running."
              }

              Start-Sleep -Seconds 60
          }
