name: Avica Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avica:
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: pwsh

    steps:

      # 1. Enable RDP
      - name: Enable RDP
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          netsh advfirewall firewall add rule `
            name="RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP enabled."


      # 2. Create RDP User
      - name: Create RDP User
        run: |
          $upper   = [char[]](65..90)
          $lower   = [char[]](97..122)
          $number  = [char[]](48..57)
          $special = [char[]](33..47)

          $chars = @()
          $chars += $upper   | Get-Random -Count 4
          $chars += $lower   | Get-Random -Count 4
          $chars += $number  | Get-Random -Count 4
          $chars += $special | Get-Random -Count 4

          $password = -join (
            $chars | Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          Write-Host "RDP user created."


      # 3. Download Avica
      - name: Download Avica
        run: |
          $url = "https://download.avica.com/downloader/Avica_setup.exe"
          $installer = "$env:TEMP\Avica_setup.exe"

          Write-Host "Downloading Avica..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "Avica download failed."
          }

          Write-Host "Avica downloaded."

          echo "AVICA_INSTALLER=$installer" >> $env:GITHUB_ENV


      # 4. Install Avica
      - name: Install Avica
        run: |
          Write-Host "Installing Avica..."

          Start-Process `
            -FilePath "$env:AVICA_INSTALLER" `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Avica installation completed."

          Remove-Item `
            "$env:AVICA_INSTALLER" `
            -Force `
            -ErrorAction SilentlyContinue


      # 5. Wait exactly 2 minutes
      - name: Wait 2 Minutes
        run: |
          Write-Host "Waiting exactly 2 minutes..."
          Start-Sleep -Seconds 120
          Write-Host "2 minutes completed."


      # 6. Take Screenshot
      - name: Take Screenshot
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bounds = $screen.Bounds

          Write-Host "Screen: $($bounds.Width)x$($bounds.Height)"

          $bitmap = New-Object `
            System.Drawing.Bitmap `
            $bounds.Width,
            $bounds.Height

          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          $graphics.CopyFromScreen(
            $bounds.X,
            $bounds.Y,
            0,
            0,
            $bounds.Size,
            [System.Drawing.CopyPixelOperation]::SourceCopy
          )

          $path = "$env:GITHUB_WORKSPACE\Avica-Screenshot.png"

          $bitmap.Save(
            $path,
            [System.Drawing.Imaging.ImageFormat]::Png
          )

          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "Screenshot saved: $path"


      # Upload screenshot
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Avica-Screenshot
          path: Avica-Screenshot.png
          retention-days: 1
